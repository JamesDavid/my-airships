// ================================================================ the models
//
// A PARTS INDICATOR, not a model editor: it says what each thing costs and what
// could be done about it, and changes nothing. The suggestions are the rules
// that were learned by hand on this project, written down so they stop being
// remembered:
//
//   INSTANCE  identical geometry AND the same material, four times or more.
//             An InstancedMesh is one draw whatever the count -- and unlike a
//             merge it SURVIVES BEING ANIMATED, which is why the Grande Roue is
//             instanced and not merged: she turns.
//   MERGE     several parts sharing a material that never move. Same one draw,
//             but the transform is baked in, so anything that animates must be
//             left out of it.
//   LOOK      a great many draws in one model. Neither of the above helps when
//             the parts are all different; that wants a cheaper far version.
//
// AND THE TRAPS, both of which cost a day here: never merge an InstancedMesh
// (its copies live in a matrix array the walker never reads, so you get one of
// them), and a merge that drops UVs makes every textured face sample one texel
// -- which looked like "the dials on the airship broke".
//
// It builds the REAL world with the real three.js, because the headless three in
// tools/ gives every mesh its own material object and so cannot answer the one
// question being asked: which parts share a material.

let THREE = null, builtWorld = null, models = [], pickedModel = null, modelNotes = {};
let sortBy = 'fleet';        // fleet draws | draws each | triangles | copies
let foldBySize = false;      // by SHAPE by default: that is the instancing question
let showAllCopies = true;    // and show the whole fleet where it stands
// A SET, not a piece. One bar through the pilot's chest is one note; a whole
// assembly that ought to be instanced is one note about eight pieces, and
// writing it eight times is how a queue stops being read.
let pickedParts = [];               // pieces of it, chosen in the preview

/** A stable name for a SET of pieces. */
function partsKey(m, parts) {
  if (parts.length === 1) return partKey(m, parts[0]);
  const idx = parts.map((x) => m.parts.indexOf(x)).sort((a, b) => a - b);
  // first, last, how many, and a sum -- short enough for a filename and
  // specific enough that two different sets do not land on the same one
  return `${modelKey(m)}--parts-${idx.length}-${shortHash(idx.join(','))}`;
}

/** A stable name for one PIECE of a model: what it is, and which of them. */
function partKey(m, part) {
  const i = m.parts.indexOf(part);
  const what = (part.name || part.o.type || 'part').replace(/[^A-Za-z0-9]+/g, '-').slice(0, 20);
  return `${modelKey(m)}--${what}-${i}`.toLowerCase();
}

/**
 * A stable name for a model across runs.
 *
 * HASHED, NOT TRUNCATED. This used to be the fingerprint itself cut to sixty
 * characters -- and every air-ship begins with the same rigging wires, so all
 * ten of them cut down to the SAME sixty characters and shared one note file.
 * A note left on the No. 9 appeared on the Brazil, and the `--parts-...` suffix
 * that says WHICH pieces were meant fell off the end entirely, which is why
 * "when I select specific pieces and leave a note I don't think it associates
 * the pieces with the note". It did not: the name it was filed under could not
 * hold that much.
 *
 * A hash is the same length whatever it is given, so nothing is ever cut off.
 */
function shortHash(str) {
  let h = 2166136261 >>> 0;                    // FNV-1a
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36);
}
const modelKey = (m) => `${$('#whichWorld').value}-${m.copies}x-${shortHash(m.fingerprint)}`;
let pv = null;                      // the preview renderer, made once

async function three() {
  if (!THREE) THREE = await import('three');
  return THREE;
}

/**
 * Build a world once and keep it. Paris is not cheap.
 *
 * SINGLE-FLIGHT, AND KEYED BY PLACE. It used to cache one world in a variable
 * and return it to anybody: ask for Monaco while Paris is still building and the
 * finishing build overwrites the cache, so the picker says one thing and the map
 * is another. Measured, asking for Monaco landed on St. Louis. So the promise is
 * remembered per place, a second ask for the same place joins the first rather
 * than starting another, and a build only becomes THE world if the picker still
 * wants it by the time it lands.
 */
let worldPending = null, worldPendingFor = null;
async function getWorld() {
  const place = $('#whichWorld').value;
  if (builtWorld && builtWorld.place === place) return builtWorld;
  if (worldPending && worldPendingFor === place) return worldPending;
  worldPendingFor = place;
  worldPending = (async () => {
    const T = await three();
    // THE SHIPS ARE NOT IN ANY WORLD, which is why they were nowhere in this
    // tab: a world is built by buildWorld, and a ship is built beside it by
    // `new Airship(scene, spec)` whenever one is spawned. They are also the
    // objects that matter most here -- the ship is the one thing a pilot
    // inspects from half a metre, she was 132 draws, and the attempt to merge
    // her had to be reverted whole. So the shed is a place like any other.
    if (place === 'ships') {
      const { Airship } = await import('/src/airship.js');
      const { SHIPS, SHIP_KEYS } = await import('/src/ships.js');
      const scene = new T.Scene();
      const ids = [...new Set(Object.values(SHIP_KEYS))];
      const marks = [];
      let x = 0;
      for (const id of ids) {
        const spec = SHIPS[id];
        if (!spec) continue;
        const a = new Airship(scene, spec);
        a.reset(new T.Vector3(x, ((spec.keel && spec.keel.drop) || 6) + 4, 0), 0);
        a.group.name = spec.name || id;
        marks.push({ x, z: 0, name: spec.name || id });
        x += 90;                       // far enough apart to be told apart
      }
      const made = { scene, world: { landmarks: marks }, place };
      if ($('#whichWorld').value === place) builtWorld = made;
      return made;
    }
    const mod = place === 'monaco' ? await import('/src/world_monaco.js')
      : place === 'stlouis' ? await import('/src/world_stlouis.js')
      : await import('/src/world.js');
    const scene = new T.Scene();
    const build = mod.buildWorldMonaco || mod.buildWorldStLouis || mod.buildWorld;
    const world = build.length > 1 ? build(scene, 'paris') : build(scene);
    const made = { scene, world, place };
    if ($('#whichWorld').value === place) builtWorld = made;
    return made;
  })();
  return worldPending;
}

// SIZE IS NOT PART OF THE SHAPE, for the question being asked here.
//
// An InstancedMesh carries a matrix per instance, so a two-metre box and a
// forty-metre box are the SAME GEOMETRY scaled differently and can be one draw.
// That is exactly how the Deutsch skeleton went from thirty boxes to one.
//
// Folding on the exact dimensions therefore split what should have been folded:
// "a lot of models called 1 box - by the hill of Saint-Cloud", each its own row,
// each a separate wish, when together they are one instancing job. Only the type
// and the SEGMENT counts matter -- a 12-sided cylinder and an 8-sided one really
// are different geometry and cannot share an instance.
const SIZELESS = /^(width|height|depth|radius|radiusTop|radiusBottom|length|innerRadius|outerRadius|tube|arc|thetaStart|thetaLength|phiStart|phiLength)$/;
function shapeFamily(m) {
  const g = m.geometry || {};
  const p = g.parameters || {};
  const segs = Object.keys(p).filter((k) => !SIZELESS.test(k)).sort()
    .map((k) => k + ':' + p[k]).join(',');
  return (g.type || '?') + '[' + segs + ']';
}

/** What a part IS, for the purpose of asking whether two of them are the same. */
function signature(m) {
  const g = m.geometry || {};
  const p = g.parameters || {};
  const shape = (g.type || '?') + '(' + Object.keys(p).sort()
    .map((k) => (typeof p[k] === 'number' ? +p[k].toFixed(3) : p[k])).join(',') + ')';
  const mat = Array.isArray(m.material) ? m.material.map((x) => x.uuid).join('+')
    : (m.material && m.material.uuid) || '-';
  return { shape, mat, family: shapeFamily(m), key: shape + '|' + mat };
}

const tris = (m) => {
  const g = m.geometry, a = g && g.attributes && g.attributes.position;
  if (!a) return 0;
  const n = (g.index ? g.index.count : a.count) / 3;
  return Math.round(n * (m.isInstancedMesh ? (m.count || 1) : 1));
};

function analyse(root, name) {
  const parts = [];
  root.traverse((o) => {
    if (!o.isMesh && !o.isInstancedMesh) return;
    let animates = false;
    for (let n = o, i = 0; n && i < 24; n = n.parent, i++) {
      if (n.userData && n.userData.animates) { animates = true; break; }
    }
    parts.push({ o, name: o.name || o.type, sig: signature(o), tris: tris(o),
      instanced: !!o.isInstancedMesh, count: o.count || 1, animates, visible: o.visible });
  });
  const draws = parts.filter((p) => p.visible).length;
  // group by "the same thing twice"
  const groups = new Map();
  for (const p of parts) {
    const g = groups.get(p.sig.key) || { sig: p.sig, list: [] };
    g.list.push(p);
    groups.set(p.sig.key, g);
  }
  // and by material alone, for merging
  const byMat = new Map();
  for (const p of parts) {
    if (p.instanced) continue;
    const g = byMat.get(p.sig.mat) || [];
    g.push(p);
    byMat.set(p.sig.mat, g);
  }
  const tips = [];
  for (const g of groups.values()) {
    const plain = g.list.filter((p) => !p.instanced);
    if (plain.length >= 4) {
      tips.push({ kind: 'instance', n: plain.length, saves: plain.length - 1,
        what: g.sig.shape, animates: plain.some((p) => p.animates) });
    }
  }
  for (const [mat, list] of byMat) {
    const still = list.filter((p) => !p.animates);
    const already = tips.some((t) => t.kind === 'instance' && list.some((p) => p.sig.mat === mat));
    if (still.length >= 4 && !already) {
      tips.push({ kind: 'merge', n: still.length, saves: still.length - 1,
        what: 'parts sharing one material', frozen: list.length - still.length });
    }
  }
  tips.sort((a, b) => b.saves - a.saves);
  const instanced = parts.filter((p) => p.instanced).length;
  // WHAT MAKES TWO MODELS THE SAME MODEL. The multiset of its parts' shapes --
  // not their materials, because two chestnut trees may be tinted differently
  // and are still the same tree, and not their positions, because that is the
  // whole point. This is what turns a list of 1,529 anonymous groups into
  // "here is one tree, and there are four hundred of it".
  const fingerprint = parts.map((p) => p.sig.shape).sort().join(';');
  const family = parts.map((p) => p.sig.family).sort().join(';');
  return { name, root, parts, groups: [...groups.values()], draws, instanced,
    tris: parts.reduce((a, p) => a + p.tris, 0), tips, fingerprint, family };
}

/**
 * A name a person can use.
 *
 * Almost nothing in the world is named -- the game had no reason to name it --
 * so a list of "Group #146861" is no use at all. A model is described by what it
 * is MADE of and where it stands: the parts it has most of, and the landmark it
 * is nearest, which between them are enough to recognise a thing by.
 */
function label(m, landmarks) {
  const named = m.root.name || (m.parts.find((p) => p.o.name) || {}).o?.name;
  const shapes = {};
  for (const p of m.parts) {
    const k = (p.sig.shape.split('(')[0] || '?').replace(/Geometry$/, '');
    shapes[k] = (shapes[k] || 0) + 1;
  }
  const made = Object.entries(shapes).sort((a, b) => b[1] - a[1]).slice(0, 2)
    .map(([k, n]) => n + ' ' + k.toLowerCase()).join(' + ');
  let near = '';
  if (landmarks && landmarks.length) {
    const pos = m.root.position;
    let best = null;
    for (const L of landmarks) {
      const d = Math.hypot(L.x - pos.x, L.z - pos.z);
      if (!best || d < best.d) best = { d, name: L.name };
    }
    if (best && best.d < 900) near = ' · by ' + best.name;
    else if (best) near = ' · ' + Math.round(best.d / 100) / 10 + ' km from ' + best.name;
  }
  return (named ? named + ' — ' : '') + (made || m.root.type) + near;
}

async function loadModels() {
  const list = $('#modelList');
  if (models.length && builtWorld && builtWorld.place === $('#whichWorld').value) return drawModelList();
  list.innerHTML = '<div class="empty">building the world…</div>';
  $('#parts').innerHTML = '';
  let built;
  try { built = await getWorld(); }
  catch (e) { list.innerHTML = '<div class="empty">could not build it: ' + esc(e.message) + '</div>'; return; }
  try { modelNotes = await (await fetch('/api/modelnotes')).json(); } catch (e) { modelNotes = {}; }
  const lm = (built.world && built.world.landmarks) || [];
  const each = built.scene.children
    .filter((o) => o.type !== 'DirectionalLight' && o.type !== 'AmbientLight'
      && o.type !== 'HemisphereLight')
    .map((o, i) => analyse(o, o.name || `${o.type} #${i}`))
    .filter((m) => m.parts.length);
  // FOLD THE COPIES TOGETHER. Four hundred chestnut trees are one model and a
  // number, not four hundred entries, and the number IS the finding.
  const byShape = new Map();
  for (const m of each) {
    const key = foldBySize ? m.fingerprint : m.family;
    const g = byShape.get(key);
    if (g) { g.copies++; g.all.push(m); } else byShape.set(key, { ...m, copies: 1, all: [m] });
    // ...and remember how many DIFFERENT materials the copies use, because that
    // is what decides whether the saving on offer is real. See the tip below.
    const g2 = byShape.get(key);
    g2.mats = g2.mats || new Set();
    for (const part of m.parts) g2.mats.add(part.sig.mat);
  }
  models = [...byShape.values()];
  for (const m of models) m.name = label(m, lm);
  sortModels();
  drawModelList();
}

/**
 * WHICH NUMBER IS THE BIG ONE depends on what you are about to do.
 *
 * Sorted by what the whole fleet costs, a thing drawn once but drawn expensively
 * hides under four hundred cheap ones -- and it is the expensive single model
 * that wants a cheaper far version, where the four hundred want instancing.
 * Both questions are asked in this tab, so both orders are offered.
 */
function sortModels() {
  const key = {
    fleet: (m) => m.draws * m.copies,
    each: (m) => m.draws,
    tris: (m) => m.tris * m.copies,
    copies: (m) => m.copies,
  }[sortBy] || ((m) => m.draws * m.copies);
  models.sort((a, b) => key(b) - key(a));
}

function drawModelList() {
  const list = $('#modelList');
  // draws in the WORLD, so copies count — the header used to add one of each
  const total = models.reduce((a, m) => a + m.draws * m.copies, 0);
  const copies = models.reduce((a, m) => a + m.copies, 0);
  list.innerHTML = `<div class="m" style="cursor:default;border-bottom:1px solid var(--edge);
      display:block">
      <div><span class="d">${total}</span> <span class="n">draws · ${models.length} distinct
      models in ${copies} objects</span></div>
      <div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">
        <button class="chip ${foldBySize ? '' : 'on'}" id="foldShape">by shape</button>
        <button class="chip ${foldBySize ? 'on' : ''}" id="foldSize">by exact size</button>
        <button class="chip ${showAllCopies ? 'on' : ''}" id="allCopies">show them together</button>
      </div>
      <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">
        <span style="color:var(--dim);font-size:11px;align-self:center">sort:</span>
        <button class="chip ${sortBy === 'fleet' ? 'on' : ''}" data-sort="fleet">draws in all</button>
        <button class="chip ${sortBy === 'each' ? 'on' : ''}" data-sort="each">draws each</button>
        <button class="chip ${sortBy === 'tris' ? 'on' : ''}" data-sort="tris">triangles</button>
        <button class="chip ${sortBy === 'copies' ? 'on' : ''}" data-sort="copies">how many</button>
      </div></div>`;
  models.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'm' + (m === pickedModel ? ' on' : '');
    const fleet = sortBy === 'each' ? m.draws
      : sortBy === 'tris' ? Math.round((m.tris * m.copies) / 1000) + 'k'
      : sortBy === 'copies' ? m.copies : m.draws * m.copies;
    // EVERY note on this model, including the ones left on its PIECES.
    //
    // The badge used to look up the model's own key alone, so a note about two
    // pieces of the No. 9's basket lit nothing at all -- "no queued marking
    // tho?" -- and the list said the model was untouched while the queue said
    // otherwise. A piece's key is the model's key with a suffix, so the model's
    // own note and all its pieces' notes are the keys that begin with it.
    const mine = Object.entries(modelNotes)
      .filter(([k]) => k === modelKey(m) || k.startsWith(modelKey(m) + '--'))
      .map(([, v]) => v);
    const open = mine.filter((v) => !v.done).length;
    el.innerHTML = `<span class="d">${fleet}</span><span class="n">`
      + (m.copies > 1 ? `<b style="color:var(--hot)">×${m.copies}</b> ` : '')
      + `${esc(m.name)}</span>`
      + (mine.length
        ? `<span class="tag ${open ? 'note' : 'done'}">${open ? 'queued' + (mine.length > 1 ? ' ' + open : '') : 'done'}</span>`
        : '');
    el.onclick = () => pickModel(i);
    list.appendChild(el);
  });
  $('#foldShape').onclick = () => { if (foldBySize) { foldBySize = false; models = []; pickedModel = null; loadModels(); } };
  $('#foldSize').onclick = () => { if (!foldBySize) { foldBySize = true; models = []; pickedModel = null; loadModels(); } };
  $('#allCopies').onclick = () => { showAllCopies = !showAllCopies; drawModelList(); if (pickedModel) showPreview(pickedModel); };
  for (const b of document.querySelectorAll('#modelList [data-sort]')) {
    b.onclick = () => { sortBy = b.dataset.sort; sortModels(); drawModelList(); };
  }
  if (!pickedModel && models.length) pickModel(0);
}

async function pickModel(i) {
  pickedModel = models[i];
  drawModelList();
  const m = pickedModel;
  const H = [];
  if (m.copies > 1) {
    // HOW MUCH OF THIS IS REALLY ON OFFER. The copies are folded together by
    // GEOMETRY, on purpose — two chestnuts tinted differently are the same tree,
    // and an InstancedMesh carries a per-instance matrix, so differing SIZE and
    // position cost nothing (that is how the Deutsch skeleton went from thirty
    // boxes to one). Differing MATERIALS are another matter: they must be made
    // one, or carried as per-instance colour, before any of this is collectable.
    // Saying so is the difference between a tool and a wish.
    const mats = (m.mats && m.mats.size) || 1;
    const most = m.copies * m.draws - m.draws;
    H.push(`<div class="tip"><b>${m.copies} of this model, ${m.draws} draw${m.draws === 1 ? '' : 's'}
      each — ${m.draws * m.copies} in all.</b> They are the same geometry, and an instance carries
      its own matrix, so differing size and position cost nothing.
      ${mats === 1
        ? `They also share a single material, so <b>${most}</b> draws are there to be had.`
        : `But they use <b>${mats} different materials</b>, and an InstancedMesh has one. Make them
           one material — or carry the difference as per-instance colour — and <b>${most}</b> draws
           are there to be had. Until then this number is a wish, not a saving.`}</div>`);
  }
  H.push(`<div class="big">
    <div><b>${m.draws}</b><span>draw calls each</span></div>
    <div><b>${m.copies}</b><span>of it</span></div>
    <div><b>${m.tris.toLocaleString()}</b><span>triangles</span></div>
    <div><b>${m.instanced}</b><span>already instanced</span></div>
    <div><b>${m.groups.length}</b><span>distinct parts</span></div>
  </div>`);
  for (const t of m.tips) {
    if (t.kind === 'instance') {
      H.push(`<div class="tip"><b>Instance these.</b> ${t.n} parts are the same geometry and the
        same material — <code>${esc(t.what)}</code>. One InstancedMesh is <b>one draw</b> instead of
        ${t.n}, saving <b>${t.saves}</b>${t.animates ? ' — and some of them animate, which is fine: '
        + 'an instance can still be moved, where a merge could not' : ''}.</div>`);
    } else {
      H.push(`<div class="tip"><b>Merge these.</b> ${t.n} parts share one material and never move.
        Merged they are one draw, saving <b>${t.saves}</b>.
        ${t.frozen ? `Leave out the ${t.frozen} that animate — a merge bakes the transform in and
        would freeze them.` : ''} Keep the UVs, or every textured face samples one texel.</div>`);
    }
  }
  if (!m.tips.length) {
    H.push(`<div class="tip good"><b>Nothing obvious.</b> No four parts here share a geometry and a
      material. ${m.draws > 20 ? 'It is still ' + m.draws + ' draws, so if it is far away and never '
      + 'culled it wants a cheaper version rather than a cleverer one.' : 'And it is cheap already.'}</div>`);
  }
  H.push('<h2 style="font-size:14px;color:var(--hot);margin:16px 0 4px">The parts</h2>');
  const rows = m.groups.map((g) => ({
    first: g.list[0], _idx: m.parts.indexOf(g.list[0]),
    n: g.list.length, shape: g.sig.shape,
    tris: g.list.reduce((a, p) => a + p.tris, 0),
    inst: g.list.filter((p) => p.instanced).length,
    anim: g.list.filter((p) => p.animates).length,
    name: g.list[0].name,
  })).sort((a, b) => b.n - a.n);
  H.push(table(rows, [
    { h: 'x', n: 1, f: (r) => r.n },
    { h: '', f: (r) => (modelNotes[partKey(m, r.first)] ? '<span class="tag note">·</span>' : '') },
    { h: 'part', f: (r) => esc(r.name) },
    { h: 'geometry', f: (r) => '<span style="opacity:.7">' + esc(r.shape.slice(0, 64)) + '</span>' },
    { h: 'tris', n: 1, f: (r) => r.tris.toLocaleString() },
    { h: 'instanced', n: 1, f: (r) => r.inst || '' },
    { h: 'animates', n: 1, f: (r) => r.anim || '' },
  ]));
  H.push('<div id="noteBox"></div>');
  $('#parts').innerHTML = H.join('');
  // clicking a row of the table selects that piece in the picture too
  for (const r of document.querySelectorAll('#parts tr[data-part]')) {
    r.style.cursor = 'pointer';
    r.onclick = (e) => choosePart(m.parts[+r.dataset.part], e.ctrlKey || e.metaKey);
  }
  choosePart(null);
  showPreview(m);
}

/**
 * Somewhere to say what should be done — about the model, or about ONE PIECE.
 *
 * The tool can say what a thing costs and what the rules suggest; it cannot know
 * whether this particular tree is worth an afternoon, and it certainly cannot
 * know that the third box from the left is the one standing through the deck.
 * That is a judgement, it belongs in words, and it belongs beside the numbers
 * and the picture that prompted it.
 *
 * A piece's note is kept under its own key, so the model can carry "instance
 * this" and one of its parts can carry "this one is inside out" at the same
 * time, and both come out in the queue.
 */
function drawNoteBox() {
  const m = pickedModel;
  if (!m) return;
  const box = $('#noteBox');
  if (!box) return;
  const parts = pickedParts;
  const part = parts.length === 1 ? parts[0] : null;
  const key = parts.length ? partsKey(m, parts) : modelKey(m);
  const have = modelNotes[key] || { note: '', done: false };
  const name = parts.length === 1 ? `${m.name} — ${part.name || part.o.type}`
    : parts.length ? `${m.name} — ${parts.length} pieces` : m.name;
  const about = part
    ? `<b>${esc(part.name || part.o.type)}</b> — ${esc(part.sig.shape.slice(0, 70))},
       ${part.tris.toLocaleString()} triangles${part.instanced ? ', instanced' : ''}${part.animates ? ', animates' : ''}
       &nbsp;<button id="mall" class="mark">note the whole model instead</button>`
    : parts.length
      ? `<b>${parts.length} pieces</b> — ${parts.reduce((a, x) => a + x.tris, 0).toLocaleString()}
         triangles between them: ${esc([...new Set(parts.map((x) => x.name || x.o.type))].join(', ').slice(0, 80))}
         &nbsp;<button id="mall" class="mark">note the whole model instead</button>`
      : `the whole model &nbsp;<span style="color:var(--dim)">— click a piece in the picture, or a row
         above, to talk about just that one · <b>ctrl-click</b> to take several</span>`;
  // THE THREAD, so a model carries its whole history and not merely its latest
  // complaint. An issue is raised, something is done about it, and the doing is
  // written under the raising where the next person will find both.
  const thread = (have.thread || []).map((e) => `
    <div class="said ${e.who === 'works' ? 'works' : ''}">
      <div class="who"><b>${esc(e.who === 'works' ? 'the works' : 'you')}</b>${e.when ? ' · ' + esc(e.when) : ''}</div>
      <div class="txt">${esc(e.text)}</div>
    </div>`).join('');
  box.innerHTML = `<h2 style="font-size:14px;color:var(--hot);margin:18px 0 4px">What to do about it</h2>
    <p class="note" style="margin:0 0 6px">${about}</p>
    ${have.done ? '<p class="settled">✓ settled — reopen it by adding to the thread and pressing “not done”.</p>' : ''}
    <div class="thread">${thread}</div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <textarea id="mnote" style="flex:1;min-height:74px;resize:vertical;font:inherit;font-size:13px;
        color:var(--ink);background:#17120d;border:1px solid var(--edge);border-radius:4px;padding:6px 8px"
        placeholder="${part ? 'e.g. this bar is what goes through the pilot in the headset — drop it 40 cm'
          : 'e.g. one material and per-instance colour would collect the 1,004 draws — worth it, this is the whole city'}"
        ></textarea>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button id="msave" class="go">${have.thread && have.thread.length ? 'Reply' : 'Raise it'}</button>
        <button id="mdone" class="${have.done ? 'on' : ''}">${have.done ? 'not done' : 'mark settled'}</button>
      </div>
    </div>
    <p class="note" style="color:var(--dim);font-size:12px">Kept in bug-notes/models/, indexed in
      bug-notes/MODELS.md. Not filed as a bug report — that queue is what pilots write to.</p>`;
  const send = async (done) => {
    const stats = parts.length
      ? { place: $('#whichWorld').value, partOf: m.name, copiesOfModel: m.copies,
          pieces: parts.length,
          geometry: [...new Set(parts.map((x) => x.sig.shape))].join(' + ').slice(0, 220),
          triangles: parts.reduce((a, x) => a + x.tris, 0),
          instanced: parts.filter((x) => x.instanced).length,
          animates: parts.filter((x) => x.animates).length }
      : { place: $('#whichWorld').value, copies: m.copies, drawsEach: m.draws,
          drawsTotal: m.draws * m.copies, triangles: m.tris,
          materials: (m.mats && m.mats.size) || 1, parts: m.groups.length };
    const res = await (await fetch('/api/modelnote', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, name, note: $('#mnote').value, done, stats }) })).json();
    modelNotes = res.notes || modelNotes;
    say(res.file ? 'written to bug-notes/models/' + res.file : 'taken off the queue');
    drawModelList();
    drawNoteBox();                 // re-read, or "mark done" is a one-way door
  };
  $('#msave').onclick = () => send(!!have.done);
  $('#mdone').onclick = () => send(!have.done);
  if ($('#mall')) $('#mall').onclick = () => choosePart(null);
  // and the placeholder should suit what is actually selected
  if (parts.length > 1 && $('#mnote') && !$('#mnote').value) {
    $('#mnote').placeholder = 'e.g. these eight are one assembly and never move — merge them, '
      + 'or instance the bay and repeat it';
  }
}

/**
 * Select a piece — from the picture, or from a row of the table.
 *
 * `add` is ctrl (or cmd) held: the piece joins the selection, or leaves it if it
 * was already in. Without it the selection becomes just that piece, which is
 * what a plain click has always meant everywhere.
 */
function choosePart(part, add) {
  if (!part) pickedParts = [];
  else if (!add) pickedParts = [part];
  else {
    const i = pickedParts.indexOf(part);
    if (i >= 0) pickedParts.splice(i, 1); else pickedParts.push(part);
  }
  drawMarkers();
  drawNoteBox();
  const chosen = new Set(pickedParts.map((x) => pickedModel.parts.indexOf(x)));
  for (const r of document.querySelectorAll('#parts tr[data-part]')) {
    r.classList.toggle('us', chosen.has(+r.dataset.part));
  }
}

/** One box round each chosen piece. Pooled: a model may have a hundred parts. */
async function drawMarkers() {
  if (!pv) return;
  const T = await three();
  pv.markers = pv.markers || [];
  while (pv.markers.length < pickedParts.length) {
    const h = new T.BoxHelper(new T.Object3D(), 0xffd60a);
    pv.markers.push(h);
    pv.scene.add(h);
  }
  pv.markers.forEach((h, i) => {
    const part = pickedParts[i];
    if (part) { h.setFromObject(part.o); h.visible = true; } else h.visible = false;
  });
}

/** The model on its own, turning, so you can see what you are being told about. */
async function showPreview(m) {
  const T = await three();
  const box = $('#preview');
  if (!pv) {
    const renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    box.innerHTML = '<div class="lbl"></div>';
    box.appendChild(renderer.domElement);
    const scene = new T.Scene();
    scene.background = new T.Color(0x0d0a07);
    scene.add(new T.HemisphereLight(0xffe9c4, 0x30302a, 2.1));
    const key = new T.DirectionalLight(0xfff0d0, 1.4); key.position.set(3, 6, 2); scene.add(key);
    const camera = new T.PerspectiveCamera(45, 1, 0.1, 40000);
    const holder = new T.Group(); scene.add(holder);
    pv = { renderer, scene, camera, holder, t: 0 };
    // ---- CLICK A PIECE ----
    //
    // The list and the table can tell you that a model is 109 boxes; only the
    // picture can tell you WHICH of them is the one standing through the deck.
    // So the preview is pickable, and a note can be left on one piece rather
    // than on the whole thing.
    //
    // The model turns by itself until you touch it, and then it stops: a target
    // that is moving when you aim at it is a target you will miss. After that
    // the drag is yours -- and a drag is only a pick if the pointer barely moved,
    // or every attempt to look round the far side selects something.
    const ray = new T.Raycaster();
    const ndc = new T.Vector2();
    let down = null;
    // yaw and pitch turn it; zoom is a multiple of the framing distance; target
    // is the point it turns about, which panning moves.
    const spin = { yaw: 0.9, pitch: 0.9, auto: true, zoom: 1, target: new T.Vector3() };
    pv.spin = spin;
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // ---- WHEEL TO ZOOM, RIGHT-DRAG (or shift-drag) TO PAN ----
    //
    // Once the spin is stopped the model just sits there, and a fence seen from
    // one fixed distance is no more use than a fence in a list. Zoom is a
    // multiplier on the framing distance rather than a camera move, so it means
    // the same thing whether the thing is a hatbox or the Trocadero.
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      spin.auto = false;
      spin.zoom = Math.max(0.04, Math.min(8, spin.zoom * Math.exp(e.deltaY * 0.0012)));
    }, { passive: false });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      down = { x: e.clientX, y: e.clientY, yaw: spin.yaw, pitch: spin.pitch, moved: 0,
        pan: e.button === 2 || e.shiftKey, target: spin.target.clone(), button: e.button };
      spin.auto = false;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!down) return;
      down.moved = Math.max(down.moved, Math.hypot(e.clientX - down.x, e.clientY - down.y));
      if (down.pan) {
        // across the screen, in the world: the camera's own right and up, scaled
        // by how far away it is, so a pan drags at the same rate as the picture
        const right = new T.Vector3(), up = new T.Vector3();
        camera.matrixWorld.extractBasis(right, up, new T.Vector3());
        const k = (pv.r || 1) * spin.zoom * 0.004;
        spin.target.copy(down.target)
          .addScaledVector(right, -(e.clientX - down.x) * k)
          .addScaledVector(up, (e.clientY - down.y) * k);
        return;
      }
      spin.yaw = down.yaw - (e.clientX - down.x) * 0.008;
      spin.pitch = Math.max(0.08, Math.min(1.5, down.pitch - (e.clientY - down.y) * 0.006));
    });
    renderer.domElement.addEventListener('pointerup', (e) => {
      const wasDrag = down && down.moved > 4;
      const wasPan = down && down.pan;
      down = null;
      if (wasDrag || wasPan || !pickedModel) return;
      const b = renderer.domElement.getBoundingClientRect();
      ndc.x = ((e.clientX - b.left) / b.width) * 2 - 1;
      ndc.y = -((e.clientY - b.top) / b.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(pv.holder.children, true)
        .find((h) => h.object && (h.object.isMesh || h.object.isInstancedMesh));
      // with the whole fleet on show the piece hit may belong to any copy, so
      // the part is looked for across all of them and not only the first
      let part = null;
      if (hit) {
        for (const one of (pickedModel.all || [pickedModel])) {
          part = one.parts.find((p) => p.o === hit.object);
          if (part) break;
        }
      }
      choosePart(part, e.ctrlKey || e.metaKey);
    });

    const tick = () => {
      const w = box.clientWidth, h = box.clientHeight;
      if (w && h) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      if (spin.auto) spin.yaw += 0.004;
      if (pv.r) {
        const d = pv.r * 2.1 * spin.zoom;
        camera.position.set(
          spin.target.x + Math.cos(spin.yaw) * d * Math.cos(spin.pitch * 0.6),
          spin.target.y + Math.sin(spin.pitch) * pv.r * 1.6 * spin.zoom,
          spin.target.z + Math.sin(spin.yaw) * d * Math.cos(spin.pitch * 0.6));
        camera.lookAt(spin.target);
        // the near plane follows the zoom, or a hatbox at eight times in is all
        // z-fighting and a fairground at a twentieth is clipped away
        const near = Math.max(0.01, pv.r * spin.zoom * 0.01);
        if (Math.abs(camera.near - near) > near * 0.2) {
          camera.near = near; camera.far = Math.max(1000, pv.r * 60);
          camera.updateProjectionMatrix();
        }
      }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    };
    tick();
  }
  // BORROWED, NOT COPIED: everything is put back where it came from as soon as
  // something else is picked, so the world stays exactly as the game built it
  // and the numbers above keep meaning what they say.
  for (const b of pv.borrowed || []) { b.from.add(b.o); b.o.position.copy(b.at); }
  pv.holder.clear();
  const T2 = await three();

  // ONE, OR ALL OF THEM WHERE THEY STAND.
  //
  // "they must go together but I am only seeing a big list and can only view
  // them individually" -- quite so, and looking at one paling tells you nothing
  // about the fence. With the whole fleet borrowed at once you see the shape
  // they make, which is what decides whether instancing them is worth it and
  // what the instance ought to be.
  const roots = showAllCopies && m.all && m.all.length > 1
    ? m.all.map((x) => x.root) : [m.root];
  const bb = new T2.Box3();
  for (const r of roots) bb.expandByObject(r);
  const c = bb.getCenter(new T2.Vector3()), sz = bb.getSize(new T2.Vector3());
  pv.borrowed = roots.map((o) => ({ o, from: o.parent, at: o.position.clone() }));
  for (const r of roots) { pv.holder.add(r); r.position.sub(c); }
  pv.r = Math.max(1, sz.length() / 2);
  if (pv.spin) { pv.spin.auto = true; pv.spin.zoom = 1; pv.spin.target.set(0, 0, 0); }
  // the boxes round whatever is chosen are pooled and hidden here; they are NOT
  // a change of material, because materials are shared between hundreds of parts
  // and tinting one would tint them all and the picture would start lying.
  for (const h of pv.markers || []) h.visible = false;
  const hint = box.querySelector('.hint') || (() => {
    const el = document.createElement('div');
    el.className = 'lbl hint';
    el.style.cssText = 'top:auto;bottom:8px;font-size:11.5px;opacity:.75';
    box.appendChild(el);
    return el;
  })();
  hint.textContent = 'drag to turn · wheel to zoom · right-drag or shift-drag to pan · click a piece to note it';
  box.querySelector('.lbl').textContent = roots.length > 1
    ? `${m.name} — all ${roots.length} of them, spread over `
      + `${sz.x.toFixed(0)} x ${sz.z.toFixed(0)} m`
    : `${m.name} — ${sz.x.toFixed(1)} x ${sz.y.toFixed(1)} x ${sz.z.toFixed(1)} m`;
}

// ================================================================ the level
//
// A course seen from above, with the gates draggable.
//
// It exists because of #150: the Harbour Circuit had a corner of 167 degrees --
// very nearly a reversal -- and nobody could see it, because a course is written
// as five lines of coordinates and read as five lines of coordinates. From above
// it is obvious in a second. So the plan draws THE SAME RULE the checker applies:
// the No. 6's turning circle is 102 m at racing speed, a corner needs
// R*tan(angle/2) of straight to set up, and any corner that has not got it is
// drawn in red while you are still dragging.
//
// It writes a JSON working drawing to bug-notes/ and never touches tracks.js:
// the courses are hand-written with their reasoning in the comments beside them,
// and a tool that rewrote that file would throw the reasoning away.

const TURN_R = 102;                 // the No. 6 at racing speed; see check_scenarios
let plan = null, courses = [], course = null, dragging = null, bp = null;
// A TOKEN, because both of these await a world build and a person can change
// their mind faster than Paris builds. Without it the pending pickCourse from
// the last choice comes back, sets the world picker to ITS course's location,
// and the tab you just asked for is quietly overruled -- which is what happened:
// ask for Monaco, get the Paris courses back.
let levelSeq = 0;

async function loadLevel() {
  const seq = ++levelSeq;
  const bar = $('#planBar');
  // the shed is not a place: no ground to draw and no course to fly over it
  if ($('#whichWorld').value === 'ships') $('#whichWorld').value = 'paris';
  // the ground under the course, so a gate can be seen to be over water or into
  // a hillside — asked of the same world the game builds
  if (!builtWorld || builtWorld.place !== $('#whichWorld').value) {
    $('#plan').innerHTML = '<div class="empty">building the world…</div>';
    try { await getWorld(); } catch (e) { /* the plan still works without it */ }
    if (seq !== levelSeq) return;
    plan = null;
  }
  if (!courses.length) {
    try {
      const t = await import('/src/tracks.js');
      courses = t.TRACKS.filter((x) => x.gates && x.gates.length >= 2);
    } catch (e) {
      $('#plan').innerHTML = '<div class="empty">could not read the courses: ' + esc(e.message) + '</div>';
      return;
    }
  }
  if (seq !== levelSeq) return;
  const here = $('#whichWorld').value;
  // `location`, not `place` -- the field has always been called location, so the
  // filter matched nothing, every course was offered under Paris, and choosing
  // the Harbour Circuit left the map of Paris under the bay of Monaco.
  const ours = courses.filter((c) => (c.location || 'paris') === here);
  bar.innerHTML = '';
  const sel = document.createElement('select');
  for (const c of (ours.length ? ours : courses)) {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    sel.appendChild(o);
  }
  sel.onchange = () => pickCourse(sel.value);
  bar.appendChild(sel);
  const save = document.createElement('button');
  save.className = 'go'; save.textContent = 'Save the drawing';
  save.onclick = saveCourse;
  const reset = document.createElement('button');
  reset.textContent = 'Put it back';
  reset.onclick = () => pickCourse(course && course.id, true);
  bar.appendChild(reset); bar.appendChild(save);
  const help = document.createElement('span');
  help.className = 'sub';
  help.style.color = 'var(--dim)';
  help.innerHTML = '&nbsp; drag a gate to move it · drag its <b>stalk</b> to turn it · '
    + 'drag the map to pan, wheel to zoom · red means the corner is tighter than the ship can fly';
  bar.appendChild(help);
  pickCourse((ours[0] || courses[0]).id);
}

async function pickCourse(id, fresh) {
  const seq = ++levelSeq;
  const src = courses.find((c) => c.id === id) || courses[0];
  // AND THE GROUND FOLLOWS THE COURSE. Choosing the Harbour Circuit while the
  // picker says Paris used to draw the bay of Monaco over the Bois de Boulogne.
  const want = src.location || 'paris';
  if ($('#whichWorld').value !== want) {
    $('#whichWorld').value = want;
    models = []; pickedModel = null; plan = null;
    $('#plan').innerHTML = '<div class="empty">building ' + esc(want) + '…</div>';
    try { await getWorld(); } catch (e) { /* the plan still works without it */ }
    if (seq !== levelSeq) return;
    return loadLevel();              // the course list belongs to the new world
  }
  course = { id: src.id, name: src.name,
    gates: src.gates.map((g) => ({ x: g.x, y: g.y, z: g.z, r: g.r || 18, h: g.h || null })) };
  ensurePlan();
  fitPlan();
  drawPlan();
}

/** Frame the whole course, with room round it. Called when the course changes. */
function fitPlan() {
  const host = $('#plan');
  const W = host.clientWidth || 800, H = host.clientHeight || 600;
  const xs = course.gates.map((g) => g.x), zs = course.gates.map((g) => g.z);
  const pad = 400;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const z0 = Math.min(...zs) - pad, z1 = Math.max(...zs) + pad;
  planView = { cx: (x0 + x1) / 2, cz: (z0 + z1) / 2,
    k: Math.min(W / (x1 - x0), H / (z1 - z0)) };
}

function ensurePlan() {
  if (plan) return;
  const host = $('#plan');
  const cv = document.createElement('canvas');
  host.innerHTML = '';
  host.appendChild(cv);
  plan = { cv, ctx: cv.getContext('2d'), view: null };
  const at = (e) => {
    const b = cv.getBoundingClientRect();
    return toWorld(e.clientX - b.left, e.clientY - b.top);
  };
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const b = cv.getBoundingClientRect();
    const before = toWorld(e.clientX - b.left, e.clientY - b.top);
    planView.k *= Math.exp(-e.deltaY * 0.0016);
    planView.k = Math.max(0.004, Math.min(4, planView.k));
    const after = toWorld(e.clientX - b.left, e.clientY - b.top);
    // hold the point under the pointer still, which is what makes a zoom feel
    // like a zoom and not a jump
    planView.cx += before.x - after.x;
    planView.cz += before.z - after.z;
    drawPlan();
  }, { passive: false });

  cv.addEventListener('pointerdown', (e) => {
    const w = at(e);
    let best = null;
    course.gates.forEach((g, i) => {
      const d = Math.hypot(g.x - w.x, g.z - w.z);
      const hd = Math.hypot(g.x + Math.cos(hOf(i)) * 90 - w.x, g.z - Math.sin(hOf(i)) * 90 - w.z);
      if (hd < 40 && (!best || hd < best.d)) best = { i, d: hd, mode: 'turn' };
      if (d < 60 && (!best || d < best.d)) best = { i, d, mode: 'move' };
    });
    if (best) { dragging = best; }
    else {
      // NOT A GATE: it may be a building. Hit-tested in the building's own frame
      // -- the fair is a fan and the blocks are turned, so a click has to be
      // rotated back before it can be compared against the box.
      const hit = blockAt(w.x, w.z);
      if (hit) { showBlock(hit); dragging = null; return; }
      dragging = { mode: 'pan', from: w, cx: planView.cx, cz: planView.cz };
    }
    cv.setPointerCapture(e.pointerId);
    drawPlan();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    if (dragging.mode === 'pan') {
      // worked from the pointer's SCREEN travel, because the world point under
      // it is what we are holding still and would otherwise chase itself
      const b = cv.getBoundingClientRect();
      const now = { x: dragging.cx, z: dragging.cz };
      planView.cx = now.x; planView.cz = now.z;
      const w2 = toWorld(e.clientX - b.left, e.clientY - b.top);
      planView.cx = now.x + (dragging.from.x - w2.x);
      planView.cz = now.z + (dragging.from.z - w2.z);
      return drawPlan();
    }
    const w = at(e), g = course.gates[dragging.i];
    if (dragging.mode === 'move') { g.x = w.x; g.z = w.z; }
    else g.h = Math.atan2(-(w.z - g.z), w.x - g.x);
    drawPlan();
  });
  cv.addEventListener('pointerup', () => { dragging = null; drawPlan(); });
  addEventListener('resize', () => { if (tab === 'level') drawPlan(); });
}

/** The heading a gate faces: its own if it has been turned, else down the course. */
function hOf(i) {
  const g = course.gates[i];
  if (g.h !== null && g.h !== undefined) return g.h;
  const n = course.gates[(i + 1) % course.gates.length];
  return Math.atan2(-(n.z - g.z), n.x - g.x);
}

// The view is a CENTRE and a scale rather than a corner, because that is what
// panning and zooming want: a wheel zooms about the pointer by moving the
// centre, and a drag moves the centre directly.
let planView = null;
const planSize = () => {
  const host = $('#plan');
  return { W: host.clientWidth || 800, H: host.clientHeight || 600 };
};
function toWorld(px, py) {
  const v = planView, { W, H } = planSize();
  return { x: v.cx + (px - W / 2) / v.k, z: v.cz + (py - H / 2) / v.k };
}
function toScreen(x, z) {
  const v = planView, { W, H } = planSize();
  return { px: (x - v.cx) * v.k + W / 2, py: (z - v.cz) * v.k + H / 2 };
}

/**
 * THE GROUND UNDER THE COURSE.
 *
 * A course is judged by its corners, and the corners are only half of it: a gate
 * can have all the room in the world and still be over the Seine, or buried in
 * the hill of Saint-Cloud. Both have happened here -- "a ring in the bay that is
 * too close to a mountain", and the ring beside Notre-Dame that was clear while
 * she was two boxes and a cone.
 *
 * Sampled from world.groundAt and world.isWater, which is what the ship itself
 * flies against, so what is drawn is what is there. Rendered ONCE per view to an
 * offscreen canvas and then blitted: a gate being dragged redraws sixty times a
 * second, and thirty thousand terrain lookups a frame is a slideshow.
 */
function makeMap(v, W, H) {
  const world = builtWorld && builtWorld.world;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#0d0a07';
  c.fillRect(0, 0, W, H);
  if (!world || !world.groundAt) return cv;

  const STEP = 3;                                  // pixels per sample
  const nx = Math.ceil(W / STEP), nz = Math.ceil(H / STEP);
  const h = new Float32Array(nx * nz);
  const wet = new Uint8Array(nx * nz);
  let lo = Infinity, hi = -Infinity;
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      const x = v.cx + (i * STEP - W / 2) / v.k, z = v.cz + (j * STEP - H / 2) / v.k;
      const g = world.groundAt(x, z) || 0;
      h[j * nx + i] = g;
      wet[j * nx + i] = world.isWater && world.isWater(x, z) ? 1 : 0;
      if (g < lo) lo = g;
      if (g > hi) hi = g;
    }
  }
  const span = Math.max(1, hi - lo);
  const img = c.createImageData(W, H);
  for (let py = 0; py < H; py++) {
    const j = Math.min(nz - 1, (py / STEP) | 0);
    for (let px = 0; px < W; px++) {
      const i = Math.min(nx - 1, (px / STEP) | 0);
      const k = j * nx + i;
      const t = (h[k] - lo) / span;
      // a little relief: the slope towards the north-west, as on a survey sheet
      const hx = h[j * nx + Math.max(0, i - 1)] - h[j * nx + Math.min(nx - 1, i + 1)];
      const hz = h[Math.max(0, j - 1) * nx + i] - h[Math.min(nz - 1, j + 1) * nx + i];
      const shade = Math.max(-1, Math.min(1, (hx + hz) / 14));
      let r, g, b;
      if (wet[k]) { r = 26; g = 52; b = 74; }
      else {
        r = 44 + t * 66 + shade * 22;
        g = 50 + t * 60 + shade * 22;
        b = 34 + t * 40 + shade * 18;
      }
      const o = (py * W + px) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  c.putImageData(img, 0, 0);

  // THE BUILDINGS, because a green field with a lagoon on it is not a fairground
  // and you cannot tell where the palaces and the pylons are. Every world already
  // publishes its colliders as {x, z, w, d, h} -- the same boxes the ship hits --
  // so what is drawn is exactly what you would fly into.
  //
  // Lit by height: the taller a thing is, the paler, so the Festival Hall and the
  // wheel stand out of the sheds around them the way they do from the air.
  const built = world.buildings || [];
  let tallest = 1;
  for (const b of built) tallest = Math.max(tallest, b.h || b.top || 1);
  // ...and drawn largest first, so a kiosk is painted ON a palace rather than
  // under it. The click test picks the smallest that fits; the drawing has to
  // agree with it or the two would disagree about what you are pointing at.
  const order = [...built].sort((p1, p2) => ((p2.w || 8) * (p2.d || 8)) - ((p1.w || 8) * (p1.d || 8)));
  for (const b of order) {
    const px = (b.x - v.cx) * v.k + W / 2, py = (b.z - v.cz) * v.k + H / 2;
    const bw = Math.max(1.5, (b.w || 10) * v.k), bd = Math.max(1.5, (b.d || 10) * v.k);
    const reach = Math.max(bw, bd);
    if (px < -reach || py < -reach || px > W + reach || py > H + reach) continue;
    const t = Math.min(1, (b.h || b.top || 1) / tallest);
    const g = Math.round(120 + t * 110);
    c.save();
    c.translate(px, py);
    // ...AND THEY TURN. "you didnt get st louis footprints right" -- and the
    // world had them right all along: world_stlouis pushes each palace collider
    // with an `ry`, because the fair is a FAN of buildings set at angles round
    // the Grand Basin, not a grid. This map drew every one of them square to the
    // page and so drew a fairground that does not exist. The rotation is the
    // same one the ship collides against, so the plan and the flying now agree.
    //
    // Screen y runs the way world z does here, so the angle goes in negated --
    // the same convention as rotation.y in the world itself.
    if (b.ry) c.rotate(-b.ry);
    c.fillStyle = `rgba(${g}, ${Math.round(g * 0.96)}, ${Math.round(g * 0.86)}, 0.85)`;
    c.fillRect(-bw / 2, -bd / 2, bw, bd);
    if (bw > 5 && bd > 5) {
      c.strokeStyle = 'rgba(30,22,14,0.7)'; c.lineWidth = 1;
      c.strokeRect(-bw / 2, -bd / 2, bw, bd);
    }
    c.restore();
  }

  // and the places, because a course is described by them
  c.font = '11px Georgia, serif';
  for (const L of world.landmarks || []) {
    const px = (L.x - v.cx) * v.k + W / 2, py = (L.z - v.cz) * v.k + H / 2;
    if (px < -60 || py < -60 || px > W + 60 || py > H + 60) continue;
    const nm = L.name || L.id || '';
    c.fillStyle = '#ffd60a';
    c.beginPath(); c.arc(px, py, 3.5, 0, 7); c.fill();
    const tw = c.measureText(nm).width;
    c.fillStyle = 'rgba(13,10,7,0.72)';
    c.fillRect(px + 5, py - 8, tw + 6, 14);
    c.fillStyle = '#f0e2c4';
    c.fillText(nm, px + 8, py + 3);
  }
  return cv;
}

function drawPlan() {
  const { cv, ctx } = plan;
  const host = $('#plan');
  const W = host.clientWidth, H = host.clientHeight;
  if (!W || !H) return;
  const dpr = devicePixelRatio || 1;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (!planView) fitPlan();

  // the map, made once for this view and kept
  const stamp = `${W}x${H}|${planView.cx.toFixed(0)},${planView.cz.toFixed(0)},`
    + `${planView.k.toFixed(5)}|${builtWorld && builtWorld.place}`;
  if (plan.stamp !== stamp) { plan.map = makeMap(planView, W, H); plan.stamp = stamp; }
  ctx.drawImage(plan.map, 0, 0);
  ctx.fillStyle = 'rgba(13,10,7,0.18)';            // let the course sit on top of it
  ctx.fillRect(0, 0, W, H);
  // a scale bar, because every judgement here is in metres
  const nw = toWorld(40, H - 30);
  const barM = planView.k > 0.08 ? 100 : planView.k > 0.02 ? 500 : 2000;
  const b0 = toScreen(nw.x, nw.z), b1 = toScreen(nw.x + barM, nw.z);
  ctx.strokeStyle = '#4a3c2c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(b0.px, b0.py); ctx.lineTo(b1.px, b1.py); ctx.stroke();
  ctx.fillStyle = '#b9a682'; ctx.font = '12px Georgia, serif';
  ctx.fillText(barM + ' m', b0.px, b0.py - 6);

  const G = course.gates, n = G.length;
  // the legs, coloured by whether the corner AT THE FAR END can be flown
  for (let i = 0; i < n; i++) {
    const a = G[i], b = G[(i + 1) % n], c = G[(i + 2) % n];
    const A = toScreen(a.x, a.z), B = toScreen(b.x, b.z);
    const inL = Math.hypot(b.x - a.x, b.z - a.z);
    const ang = corner(a, b, c);
    const need = TURN_R * Math.tan((Math.min(ang, 170) / 2 * Math.PI) / 180);
    const ok = inL - need >= 0;
    ctx.strokeStyle = ok ? '#4a6b3a' : '#c0392b';
    ctx.lineWidth = ok ? 2 : 3.5;
    ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(B.px, B.py); ctx.stroke();
    // how long the leg is, written on the leg. The whole judgement here is
    // "is there room", and room is a distance -- so it should not have to be
    // read off a table at the bottom of the screen while you drag.
    const mid = { px: (A.px + B.px) / 2, py: (A.py + B.py) / 2 };
    const txt = Math.round(inL) + ' m';
    ctx.font = '12px Georgia, serif';
    const wpx = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(13,10,7,0.72)';
    ctx.fillRect(mid.px - wpx / 2 - 4, mid.py - 9, wpx + 8, 16);
    ctx.fillStyle = ok ? '#bfae8a' : '#e88a7d';
    ctx.fillText(txt, mid.px - wpx / 2, mid.py + 3);
  }
  // the gates themselves, with a stalk showing which way each faces
  G.forEach((g, i) => {
    const P = toScreen(g.x, g.z);
    const rr = Math.max(4, g.r * planView.k);
    ctx.strokeStyle = dragging && dragging.i === i ? '#ffd60a' : '#e8c66a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.px, P.py, rr, 0, 7); ctx.stroke();
    const h = hOf(i);
    const S = toScreen(g.x + Math.cos(h) * 90, g.z - Math.sin(h) * 90);
    ctx.beginPath(); ctx.moveTo(P.px, P.py); ctx.lineTo(S.px, S.py); ctx.stroke();
    ctx.beginPath(); ctx.arc(S.px, S.py, 4, 0, 7); ctx.fillStyle = '#e8c66a'; ctx.fill();
    ctx.fillStyle = '#f0e2c4'; ctx.font = '13px Georgia, serif';
    ctx.fillText(String(i), P.px + rr + 4, P.py - 4);
  });
  writePlanInfo();
}

/** Which building, if any, is under that point of the ground. */
function blockAt(x, z) {
  const world = builtWorld && builtWorld.world;
  // SMALLEST FIRST. A palace four hundred metres long covers a dozen kiosks, and
  // taking the first box that contains the point meant the big one always won and
  // the small ones could never be clicked at all. The tightest fit is the one the
  // pointer meant.
  const all = [...((world && world.buildings) || [])]
    .sort((p1, p2) => ((p1.w || 8) * (p1.d || 8)) - ((p2.w || 8) * (p2.d || 8)));
  for (const b of all) {
    let dx = x - b.x, dz = z - b.z;
    if (b.ry) {                       // back into the building's own frame
      const c = Math.cos(b.ry), s2 = Math.sin(b.ry);
      const rx = dx * c - dz * s2, rz = dx * s2 + dz * c;
      dx = rx; dz = rz;
    }
    if (Math.abs(dx) <= (b.w || 8) / 2 && Math.abs(dz) <= (b.d || 8) / 2) return b;
  }
  return null;
}

/**
 * The model standing on that spot, in a panel beside the plan.
 *
 * The collider list says a box is HERE and this big; it does not say what it is.
 * So the nearest top-level object of the scene whose own box contains the
 * collider's middle is taken to be the thing itself -- which is the same
 * assumption the game makes when it collides with it.
 *
 * A CLONE is rendered, not the object. The Models tab borrows real objects out
 * of the world and puts them back, and two panels borrowing the same thing at
 * once would leave the world with a hole in it.
 */
async function showBlock(b) {
  const bar = $('#blockBar');
  bar.classList.add('show');
  const T = await three();
  const world = builtWorld && builtWorld.world;
  const scene = builtWorld && builtWorld.scene;
  let found = null, bestD = Infinity;
  const box = new T.Box3(), mid = new T.Vector3(b.x, 0, b.z);
  for (const o of (scene && scene.children) || []) {
    if (!o.isObject3D || o.isLight) continue;
    box.setFromObject(o);
    if (!isFinite(box.min.x) || box.isEmpty()) continue;
    const inside = b.x >= box.min.x && b.x <= box.max.x && b.z >= box.min.z && b.z <= box.max.z;
    if (!inside) continue;
    const c = box.getCenter(new T.Vector3());
    const d = Math.hypot(c.x - b.x, c.z - b.z) + (box.max.x - box.min.x) + (box.max.z - box.min.z);
    if (d < bestD) { bestD = d; found = o; }
  }
  // the nearest named landmark, purely to say WHERE this is
  let near = '';
  for (const L of (world && world.landmarks) || []) {
    const d = Math.hypot(L.x - b.x, L.z - b.z);
    if (d < 400) { near = L.name; break; }
  }
  let meshes = 0, tris = 0;
  if (found) {
    found.traverse((o) => {
      if (!o.isMesh && !o.isInstancedMesh) return;
      meshes++;
      const a = o.geometry && o.geometry.attributes && o.geometry.attributes.position;
      if (a) tris += ((o.geometry.index ? o.geometry.index.count : a.count) / 3)
        * (o.isInstancedMesh ? (o.count || 1) : 1);
    });
  }
  bar.innerHTML = `<h3>${esc((found && found.name) || 'a building')}</h3>
    <div id="blockCanvas"></div>
    <div id="blockFacts">
      <div><b>${Math.round(b.w)} × ${Math.round(b.d)} m</b>, ${Math.round(b.h || b.top || 0)} m tall
        ${b.ry ? ' · turned ' + Math.round((b.ry * 180) / Math.PI) + '°' : ''}</div>
      <div>at <b>${Math.round(b.x)}, ${Math.round(b.z)}</b>${near ? ' · by ' + esc(near) : ''}</div>
      <div style="margin-top:6px"><b>${meshes}</b> draw${meshes === 1 ? '' : 's'} ·
        <b>${Math.round(tris).toLocaleString()}</b> triangles</div>
      ${found ? '' : '<div style="margin-top:6px;color:#e88a7d">No single object stands here — '
        + 'this collider belongs to something larger, or to the terrain.</div>'}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="mark" id="blockOpen">open in Models</button>
        <button class="mark" id="blockClose">close</button>
      </div>
      <textarea id="blockNote" style="width:100%;margin-top:8px;min-height:62px;resize:vertical;
        font:inherit;font-size:12.5px;color:var(--ink);background:#17120d;border:1px solid var(--edge);
        border-radius:4px;padding:6px 8px" placeholder="something wrong with this one? it goes on the same queue"></textarea>
      <button class="mark" id="blockQueue" style="margin-top:6px">add it to the queue</button>
    </div>`;
  $('#blockClose').onclick = () => bar.classList.remove('show');

  // ---- THE SAME MODEL, AND THE SAME QUEUE ----
  //
  // Seeing a thing on the plan and wanting to say something about it is the same
  // impulse as seeing it in the Models tab, so it reaches the same place: the
  // note goes on the model's own thread, and "open in Models" takes you to the
  // fuller view of it rather than making you hunt down a list of forty-eight.
  $('#blockOpen').onclick = async () => {
    if (!found) return say('nothing here to open');
    showTab('models');
    for (let i = 0; i < 120 && !models.length; i++) await new Promise((r) => setTimeout(r, 250));
    const want = models.findIndex((m) => (m.all || [m]).some((x) => x.root === found));
    if (want >= 0) pickModel(want);
    else say('it is part of something larger — not a model of its own');
  };
  $('#blockQueue').onclick = async () => {
    const note = $('#blockNote').value.trim();
    if (!note) return say('write something first');
    // keyed by the model where there is one, so the plan and the Models tab
    // write to the SAME thread rather than two that never meet
    const one = found && models.find((m) => (m.all || [m]).some((x) => x.root === found));
    const key = one ? modelKey(one)
      : `${$('#whichWorld').value}-block-${Math.round(b.x)}-${Math.round(b.z)}`;
    const res = await (await fetch('/api/modelnote', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, who: 'you', name: (found && found.name) || `a building at ${Math.round(b.x)}, ${Math.round(b.z)}`,
        note, stats: { place: $('#whichWorld').value, at: `${Math.round(b.x)}, ${Math.round(b.z)}`,
          size: `${Math.round(b.w)} x ${Math.round(b.d)} x ${Math.round(b.h || 0)} m`,
          drawsEach: meshes, triangles: Math.round(tris) } }) })).json();
    modelNotes = res.notes || modelNotes;
    $('#blockNote').value = '';
    say(res.file ? 'queued — bug-notes/models/' + res.file : 'nothing written');
  };
  if (found) previewClone(found, $('#blockCanvas'));
}

/** A small turning view of a copy of something. Its own renderer, its own clone. */
async function previewClone(obj, host) {
  const T = await three();
  if (!bp) {
    const renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new T.Scene();
    scene.background = new T.Color(0x0d0a07);
    scene.add(new T.HemisphereLight(0xffe9c4, 0x30302a, 2.2));
    const key = new T.DirectionalLight(0xfff0d0, 1.3); key.position.set(3, 6, 2); scene.add(key);
    const camera = new T.PerspectiveCamera(45, 1, 0.1, 40000);
    const holder = new T.Group(); scene.add(holder);
    bp = { renderer, scene, camera, holder, t: 0, r: 1 };
    const tick = () => {
      const h = bp.host;
      if (h && h.clientWidth) {
        renderer.setSize(h.clientWidth, h.clientHeight, false);
        camera.aspect = h.clientWidth / h.clientHeight; camera.updateProjectionMatrix();
        bp.t += 0.005;
        const d = bp.r * 2.4;
        camera.position.set(Math.cos(bp.t) * d, bp.r * 1.3, Math.sin(bp.t) * d);
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
      }
      requestAnimationFrame(tick);
    };
    tick();
  }
  bp.host = host;
  host.innerHTML = '';
  host.appendChild(bp.renderer.domElement);
  bp.holder.clear();
  const c = obj.clone(true);
  const bb = new T.Box3().setFromObject(c);
  const mid = bb.getCenter(new T.Vector3()), sz = bb.getSize(new T.Vector3());
  c.position.sub(mid);
  bp.holder.add(c);
  bp.r = Math.max(1, sz.length() / 2);
}

const corner = (a, b, c) => {
  const iv = { x: b.x - a.x, z: b.z - a.z }, ov = { x: c.x - b.x, z: c.z - b.z };
  return Math.abs((((Math.atan2(ov.z, ov.x) - Math.atan2(iv.z, iv.x)) * 180) / Math.PI + 540) % 360 - 180);
};

function writePlanInfo() {
  const G = course.gates, n = G.length, L = [];
  L.push(`${course.name} — ${n} gates · the No. 6 circles at ${TURN_R} m, so a corner needs `
    + `${TURN_R}·tan(angle/2) of straight before it`);
  let total = 0, worst = null;
  for (let i = 0; i < n; i++) {
    const a = G[(i - 1 + n) % n], b = G[i], c = G[(i + 1) % n];
    const inL = Math.hypot(b.x - a.x, b.z - a.z);
    total += inL;
    const ang = corner(a, b, c);
    const need = TURN_R * Math.tan((Math.min(ang, 170) / 2 * Math.PI) / 180);
    const spare = inL - need;
    if (!worst || spare < worst.spare) worst = { i, spare, ang };
    L.push(`  gate ${i}   leg in ${Math.round(inL).toString().padStart(5)} m   turn `
      + `${Math.round(ang).toString().padStart(3)}°   needs ${Math.round(need).toString().padStart(4)} m`
      + `   ${spare >= 0 ? 'spare ' : 'SHORT '}${Math.abs(Math.round(spare))} m`);
  }
  L.push(`  lap ${Math.round(total)} m · tightest gate ${worst.i} at ${Math.round(worst.ang)}°, `
    + `${Math.round(worst.spare)} m ${worst.spare >= 0 ? 'in hand' : 'SHORT'}`);
  $('#planInfo').textContent = L.join('\n');
}

async function saveCourse() {
  const res = await (await fetch('/api/course', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: course.id, gates: course.gates }) })).json();
  say(res.ok ? 'written to bug-notes/' + res.file : 'could not write it');
}

boot();
</script>
