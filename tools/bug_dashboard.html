<!doctype html>
<meta charset="utf-8">
<title>My Airships — what is wrong in the picture</title>
<!--
  The page half of tools/bug_dashboard.py. It never speaks to Supabase: the
  service key stays in the server, and everything here is 127.0.0.1.

  Marks are kept in NORMALISED coordinates, 0..1 across the picture, and never
  in screen pixels. The picture is shown fitted to whatever pane it has, so a
  mark stored in pixels would land somewhere else on a different window — and
  the flattened PNG is drawn at the picture's OWN size, which is larger again.
  One arrow, three sizes, one set of numbers.
-->
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --ink: #f0e2c4; --dim: #b9a682; --panel: #2a2118; --edge: #4a3c2c;
    --paper: #17120d; --hot: #d9a441;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--paper);
    color: var(--ink); font: 14px/1.45 "Iowan Old Style", Palatino, Georgia, serif; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  aside { width: 310px; flex: none; border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; background: #1d1710; }
  aside header { padding: 10px 12px; border-bottom: 1px solid var(--edge); }
  aside .sub { color: var(--dim); font-size: 12px; }
  #list { overflow-y: auto; flex: 1; }
  .row { padding: 8px 12px; border-bottom: 1px solid #2b2318; cursor: pointer; }
  .row:hover { background: #241d14; }
  .row.on { background: #3a2d1c; box-shadow: inset 3px 0 0 var(--hot); }
  .row .id { color: var(--hot); font-weight: 700; }
  .row .meta { color: var(--dim); font-size: 11.5px; }
  .row .snip { color: #d6c7a6; font-size: 12px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #filters { padding: 7px 10px 8px; border-bottom: 1px solid var(--edge); background: #221b13; }
  #filters .row2 { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  #filters .row2:first-child { margin-top: 0; }
  .chip { font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--edge); background: #2f2519; color: var(--dim); cursor: pointer; }
  .chip:hover { background: #3a2f22; color: var(--ink); }
  .chip.on { background: var(--hot); border-color: var(--hot); color: #241b10; font-weight: 700; }
  .chip .n { opacity: .65; margin-left: 3px; }
  #nothing { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; color: var(--dim); padding: 30px; }
  #nothing.show { display: flex; }
  .tag { font-size: 10.5px; padding: 0 5px; border-radius: 8px; margin-left: 5px;
    background: #4a3c2c; color: var(--ink); }
  .tag.done { background: #2f4a2c; }
  .tag.note { background: #4a3c2c; color: var(--hot); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { padding: 7px 10px; border-bottom: 1px solid var(--edge); background: var(--panel);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 13px; color: var(--ink); background: #3a2f22;
    border: 1px solid var(--edge); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  button:hover { background: #4a3c2c; }
  button.on { background: var(--hot); color: #241b10; border-color: var(--hot); }
  button.go { background: #4a6b3a; border-color: #5d8149; }
  button.go:hover { background: #5d8149; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; }
  .spacer { flex: 1; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #0d0a07;
    display: flex; align-items: center; justify-content: center; padding: 8px; }
  #wrap { position: relative; line-height: 0; }
  #shot { display: block; }      /* sized in fit() — see there for why not CSS */
  #ink { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  #foot { border-top: 1px solid var(--edge); background: var(--panel); padding: 8px 10px;
    display: flex; flex-direction: column; gap: 7px; }
  #foot .cols { display: flex; gap: 10px; align-items: flex-start; }
  /* What the pilot actually filed, under their own picture. From a headset it is
     always the same eleven words, but from a phone or a desk it is the whole
     report — and reading it off the list in the corner of the eye, at 12 px and
     clipped to two lines, was never going to work. */
  #caption { color: var(--ink); font-size: 13.5px; line-height: 1.5; max-height: 4.6em;
    overflow-y: auto; border-left: 2px solid var(--hot); padding: 1px 0 1px 9px; }
  #caption .who { color: var(--dim); font-size: 11.5px; }
  #caption.none { border-left-color: var(--edge); color: var(--dim); font-style: italic; }
  #note { flex: 1; min-height: 84px; resize: vertical; font: inherit; font-size: 13px;
    color: var(--ink); background: #17120d; border: 1px solid var(--edge);
    border-radius: 4px; padding: 6px 8px; }
  #state { width: 340px; max-height: 148px; overflow: auto; color: var(--dim);
    font: 11.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #say { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: #3a2d1c; border: 1px solid var(--hot); padding: 7px 16px; border-radius: 4px;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #say.show { opacity: 1; }
  #typing { position: absolute; display: none; font: 600 16px/1.2 Georgia, serif;
    background: #17120dcc; color: var(--ink); border: 1px dashed var(--hot);
    padding: 2px 5px; outline: none; }
  .empty { padding: 26px; color: var(--dim); text-align: center; }
  #tabs { display: flex; gap: 4px; padding: 8px 10px 0; background: #1d1710; }
  #tabs button { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  #usage { flex: 1; overflow-y: auto; padding: 14px 18px 40px; display: none; }
  #usage.show { display: block; }
  #usage h2 { font-size: 15px; margin: 22px 0 4px; color: var(--hot); letter-spacing: .02em; }
  #usage h2:first-child { margin-top: 0; }
  #usage p.note { color: var(--dim); font-size: 12.5px; margin: 2px 0 8px; max-width: 78ch; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { padding: 3px 12px 3px 0; text-align: left; white-space: nowrap; }
  th { color: var(--dim); font-weight: 400; font-size: 11.5px; border-bottom: 1px solid var(--edge); }
  td.n, th.n { text-align: right; padding-right: 16px; font-variant-numeric: tabular-nums; }
  tr.us td { color: var(--hot); }
  .big { display: flex; gap: 26px; flex-wrap: wrap; margin: 6px 0 4px; }
  .big div { min-width: 92px; }
  .big b { display: block; font-size: 23px; line-height: 1.15; }
  .big span { color: var(--dim); font-size: 11.5px; }
  .bar { display: inline-block; height: 8px; background: #4a6b3a; border-radius: 2px;
    vertical-align: middle; }
  .bar.bad { background: #8a3b30; }
  #models, #level { flex: 1; overflow: hidden; display: none; }
  #models.show { display: flex; }
  #level.show { display: flex; flex-direction: column; }
  #modelList { width: 340px; flex: none; overflow-y: auto; border-right: 1px solid var(--edge); }
  #modelList .m { padding: 6px 10px; border-bottom: 1px solid #2b2318; cursor: pointer; display: flex; gap: 8px; }
  #modelList .m:hover { background: #241d14; }
  #modelList .m.on { background: #3a2d1c; box-shadow: inset 3px 0 0 var(--hot); }
  #modelList .m .d { color: var(--hot); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  #modelList .m .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #modelPane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #preview { height: 46%; background: #0d0a07; position: relative; }
  #preview canvas { display: block; width: 100%; height: 100%; }
  #preview .lbl { position: absolute; left: 10px; top: 8px; color: var(--dim); font-size: 12px; }
  #parts { flex: 1; overflow-y: auto; padding: 10px 14px 30px; border-top: 1px solid var(--edge); }
  .tip { border-left: 3px solid var(--hot); background: #2a2118; padding: 7px 10px; margin: 8px 0;
    font-size: 13px; line-height: 1.5; }
  .tip b { color: var(--hot); }
  .tip.good { border-left-color: #4a6b3a; }
  .tip.good b { color: #8fbf72; }
  #plan { flex: 1; position: relative; background: #0d0a07; overflow: hidden; cursor: crosshair; }
  #plan canvas { display: block; }
  #planBar { padding: 7px 10px; border-bottom: 1px solid var(--edge); background: var(--panel);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #planInfo { padding: 6px 10px; border-top: 1px solid var(--edge); background: var(--panel);
    font: 11.5px/1.6 ui-monospace, Consolas, monospace; color: var(--dim); white-space: pre; max-height: 132px; overflow: auto; }
  .mark { cursor: pointer; border: 1px solid var(--edge); background: #2f2519; color: var(--dim);
    border-radius: 9px; font: inherit; font-size: 11px; padding: 0 7px; }
  .mark.on { background: var(--hot); border-color: var(--hot); color: #241b10; }
  kbd { font: 11px ui-monospace, monospace; background: #3a2f22; border: 1px solid var(--edge);
    border-radius: 3px; padding: 0 4px; }
</style>

<aside>
  <header>
    <h1>What is wrong in the picture</h1>
    <div class="sub" id="count">loading…</div>
  </header>
  <div id="filters">
    <div class="row2" id="fStatus"></div>
    <div class="row2" id="fKind"></div>
  </div>
  <div id="list"></div>
</aside>

<main>
  <div id="tabs">
    <button id="tabReports" class="on">Reports</button>
    <button id="tabUsage">Usage</button>
    <button id="tabModels">Models</button>
    <button id="tabLevel">Level</button>
    <span class="spacer"></span>
    <select id="whichWorld" title="which world these two tabs look at">
      <option value="paris">Paris, 1901</option>
      <option value="monaco">Monaco, 1902</option>
      <option value="stlouis">St. Louis, 1904</option>
    </select>
  </div>
  <div id="usage"></div>
  <div id="models">
    <div id="modelList"></div>
    <div id="modelPane">
      <div id="preview"><div class="lbl">pick a model on the left</div></div>
      <div id="parts"></div>
    </div>
  </div>
  <div id="level">
    <div id="planBar"></div>
    <div id="plan"></div>
    <div id="planInfo"></div>
  </div>
  <div id="bar">
    <button data-tool="arrow" class="on">Arrow</button>
    <button data-tool="box">Box</button>
    <button data-tool="ring">Ring</button>
    <button data-tool="pen">Pen</button>
    <button data-tool="text">Text</button>
    <span style="width:8px"></span>
    <button class="swatch" data-ink="#ff3b30" style="background:#ff3b30"></button>
    <button class="swatch" data-ink="#ffd60a" style="background:#ffd60a"></button>
    <button class="swatch" data-ink="#32d74b" style="background:#32d74b"></button>
    <button class="swatch" data-ink="#0a84ff" style="background:#0a84ff"></button>
    <span style="width:8px"></span>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <span class="spacer"></span>
    <span class="sub" style="color:var(--dim)"><kbd>J</kbd><kbd>K</kbd> next · <kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
    <button id="close">Mark handled</button>

  </div>

  <div id="stage">

  <div id="foot">
    <div id="caption"></div>

      <textarea id="note" placeholder="What is wrong here? Plain words — “the keel bar goes through my chest”, “the water is above the quay”. The arrow says where; this says what."></textarea>
      <div id="state"></div>
    </div>
  </div>
</main>

<div id="say"></div>

<script>
const $ = (s) => document.querySelector(s);
const list = $('#list'), img = $('#shot'), ink = $('#ink'), ctx = ink.getContext('2d');
let reports = [], shown = [], cur = null, marks = [], tool = 'arrow', colour = '#ff3b30', drawing = null;

// What the list is showing. Everything is held in the page and filtered here —
// the server sends all of them once, and asking it again to see what has been
// dealt with would make a round trip out of a question we can already answer.
const filter = { status: 'open', kind: 'all' };
const STATUS = [['open', 'Open'], ['handled', 'Handled'], ['all', 'All']];
const KINDS = [['all', 'Everything'], ['headset', 'Headset'],
               ['phone', 'Phone'], ['desktop', 'Desktop']];

const say = (m) => { const e = $('#say'); e.textContent = m; e.classList.add('show');
  clearTimeout(say._t); say._t = setTimeout(() => e.classList.remove('show'), 1800); };

// ---------------------------------------------------------------- the list
async function boot() {
  reports = await (await fetch('/api/reports')).json();
  $('#count').textContent = reports.length + ' report' + (reports.length === 1 ? '' : 's')
    + ' · ' + reports.filter(r => !r.handled).length + ' open'
    + ' · ' + reports.filter(r => r.note).length + ' written up';
  chips();
  draw_list();
}

const passes = (r) => (filter.status === 'all' || (filter.status === 'handled') === !!r.handled)
  && (filter.kind === 'all' || r.kind === filter.kind);

/** The chips, each carrying how many it would show — an empty filter is not a
 *  mystery if it tells you it is empty before you press it. */
function chips() {
  for (const [host, defs, key] of [[$('#fStatus'), STATUS, 'status'], [$('#fKind'), KINDS, 'kind']]) {
    host.innerHTML = '';
    for (const [val, label] of defs) {
      const was = filter[key];
      filter[key] = val;
      const n = reports.filter(passes).length;
      filter[key] = was;
      const b = document.createElement('button');
      b.className = 'chip' + (filter[key] === val ? ' on' : '');
      b.innerHTML = esc(label) + '<span class="n">' + n + '</span>';
      b.onclick = () => { filter[key] = val; chips(); draw_list(); };
      host.appendChild(b);
    }
  }
}

function draw_list() {
  shown = reports.filter(passes);
  list.innerHTML = '';
  if (!shown.length) {
    // ...and clear the stage with it. Leaving the last report standing there
    // under an empty list reads as "here is the one that matched", which is the
    // opposite of what happened.
    list.innerHTML = '<div class="empty">Nothing under this filter.</div>';
    cur = null;
    img.removeAttribute('src');
    marks = []; redraw();
    $('#note').value = '';
    $('#state').textContent = '';
    $('#caption').innerHTML = '';
    blank('Nothing matches these filters. Widen them on the left.');
    markHandledLabel();
    return;
  }
  shown.forEach((r, i) => {
    const st = r.state || {}, sh = st.ship || {};
    const el = document.createElement('div');
    el.className = 'row' + (r === cur ? ' on' : ''); el.dataset.i = i;
    el.innerHTML = `<div><span class="id">#${r.id}</span>
        <span class="meta">${(r.created_at || '').slice(0, 16).replace('T', ' ')}
        · ${esc(r.pilot || 'no name')}</span>
        <span class="tag">${esc(r.kind || '?')}</span>
        ${r.handled ? '<span class="tag done">handled</span>' : ''}
        ${r.note ? '<span class="tag note">written up</span>' : ''}</div>
      <div class="meta">${esc(sh.place || st.location || '—')}${sh.id ? ' · ' + esc(sh.id) : ''}${st.scenario ? ' · ' + esc(st.scenario) : ''}</div>
      <div class="snip">${esc((r.body || '').slice(0, 130))}</div>`;
    el.onclick = () => show(i);
    list.appendChild(el);
  });
  show(Math.max(0, shown.indexOf(cur)));
}
const esc = (s) => String(s == null ? '' : s).replace(/[<&>]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// ---------------------------------------------------------------- one report
async function show(i) {
  if (i < 0 || i >= shown.length) return;
  cur = shown[i];
  [...list.children].forEach((c, n) => c.classList.toggle('on', n === i));
  list.children[i] && list.children[i].scrollIntoView({ block: 'nearest' });
  marks = [];
  $('#note').value = cur.note || '';
  $('#state').textContent = stateLines(cur);
  caption(cur);
  markHandledLabel();
  img.removeAttribute('src'); redraw();
  // WHY THIS SAYS SOMETHING INSTEAD OF SHOWING AN EMPTY BOX. An <img> with no
  // src, or one whose fetch failed, is a blank rectangle the same colour as the
  // pane — indistinguishable from a report whose picture is a dark sky, which
  // is exactly the fault most often filed here. It has to say which.
  const mine = cur;
  let r;
  try { r = await (await fetch('/api/shot/' + cur.id)).json(); }
  catch (e) { r = { error: 'the dashboard server is not answering — has it stopped?' }; }
  if (cur !== mine) return;                             // a faster click won
  if (r.shot) { img.src = r.shot; blank(''); }
  else blank(r.error || 'No picture was filed with this report. The state is below, '
    + 'and the words the pilot left are in the list.');
}

/**
 * What the pilot wrote, under their own picture.
 *
 * It was only ever in the list on the left, clipped to two lines at 12 px, which
 * is the wrong place for the one piece of prose in the whole report: you look at
 * the picture, and the words belong beside the picture. From a headset it is the
 * same eleven words every time; from anywhere a keyboard exists it is the actual
 * complaint, and it is often longer than two lines.
 */
function caption(r) {
  const el = $('#caption');
  const body = (r.body || '').trim();
  const who = [r.pilot || 'a pilot unknown', (r.created_at || '').slice(0, 16).replace('T', ' '),
    r.kind, r.client_version && ('build ' + r.client_version)].filter(Boolean).join(' · ');
  el.classList.toggle('none', !body);
  el.innerHTML = (body ? esc(body) : 'No words were filed with this one — only the picture and the state.')
    + '<div class="who">#' + r.id + ' · ' + esc(who) + '</div>';
}

/** Put a plain sentence where the picture would be, or take it away again. */
function blank(msg) {
  const n = $('#nothing');
  n.textContent = msg;
  n.classList.toggle('show', !!msg);
  $('#wrap').style.visibility = msg ? 'hidden' : 'visible';
}

img.onerror = () => blank('That picture could not be decoded — it may have been '
  + 'truncated on the way in.');

img.onload = () => { fit(); redraw(); };
addEventListener('resize', () => { fit(); redraw(); });

/**
 * Size the picture to the pane, and the overlay to the picture, exactly.
 *
 * Not left to `max-width: 100%`, for two reasons. A headset picture is about
 * 1,200 px wide and this window is wider than that, so CSS alone would show it
 * small in the middle of a black field — and a fault you cannot see is a fault
 * you cannot point at, which is the whole job here. And `object-fit: contain`
 * would letterbox INSIDE the element, leaving the overlay covering bars that
 * are not picture, so every mark would land offset by half a bar. Working the
 * size out here keeps the canvas and the picture the same rectangle.
 */
function fit() {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const pane = $('#stage'), pad = 16;
  // ...and it does not fill its pane to the last pixel. A picture pressed hard
  // against the frame leaves the words under it looking like an afterthought,
  // and the words are the half of this that a person writes.
  const ROOM = 0.93;
  const k = Math.min((pane.clientWidth - pad) / nw, (pane.clientHeight - pad) / nh) * ROOM;
  const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  img.style.width = w + 'px'; img.style.height = h + 'px';
  const dpr = devicePixelRatio || 1;
  ink.style.width = w + 'px'; ink.style.height = h + 'px';
  ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
}

function stateLines(r) {
  const st = r.state || {}, sh = st.ship || {}, p = st.page || {}, ui = st.ui || {}, inst = st.instruments || {};
  const L = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== '') L.push(k.padEnd(10) + v); };
  add('place', sh.place || st.location);
  add('ship', sh.id);
  if (sh.x !== undefined) add('at', `x ${sh.x}  y ${sh.y}  z ${sh.z}   yaw ${sh.yaw}`);
  add('camera', ui.camera);
  add('scenario', st.scenario);
  add('course', st.course && st.course.name);
  add('alt', inst.alt); add('speed', inst.speed); add('wind', inst.wind);
  add('screen', p.w && (p.w + '×' + p.h + ' @' + p.dpr));
  add('build', r.client_version);
  if ((st.faults || []).length) L.push('', 'faults:', ...st.faults.slice(0, 6).map(f => '  ' + String(f).slice(0, 90)));
  L.push('', 'repro: __game.ship.pos.set(' + [sh.x, sh.y, sh.z].join(', ') + '); __game.ship.yaw = ' + sh.yaw + ';');
  return L.join('\n');
}

// ---------------------------------------------------------------- drawing
// Everything is stored 0..1 so the same marks fit the screen and the saved PNG.
const at = (e) => {
  const b = ink.getBoundingClientRect();
  return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height];
};

ink.addEventListener('pointerdown', (e) => {
  if (!img.getAttribute('src')) return;
  const p = at(e);
  if (tool === 'text') return typeAt(p, e);
  ink.setPointerCapture(e.pointerId);
  drawing = { tool, colour, pts: [p] };
  redraw();
});
ink.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const p = at(e);
  if (drawing.tool === 'pen') drawing.pts.push(p); else drawing.pts[1] = p;
  redraw();
});
ink.addEventListener('pointerup', () => {
  if (!drawing) return;
  const d = drawing; drawing = null;
  const far = d.pts.length > 1 && Math.hypot(d.pts[d.pts.length - 1][0] - d.pts[0][0],
    d.pts[d.pts.length - 1][1] - d.pts[0][1]) > 0.008;
  if (far) marks.push(d);                       // a stray click is not a mark
  redraw();
});

function typeAt(p, e) {
  const box = $('#typing'), b = ink.getBoundingClientRect(), w = $('#wrap').getBoundingClientRect();
  box.style.display = 'block';
  box.style.left = (b.left - w.left + p[0] * b.width) + 'px';
  box.style.top = (b.top - w.top + p[1] * b.height - 12) + 'px';
  box.style.color = colour;
  box.value = ''; box.focus();
  box.onkeydown = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault();
      if (box.value.trim()) marks.push({ tool: 'text', colour, pts: [p], text: box.value.trim() });
      box.style.display = 'none'; redraw(); }
    if (ev.key === 'Escape') { box.style.display = 'none'; }
    ev.stopPropagation();
  };
}

function redraw() { paint(ctx, ink.width, ink.height, true); }

/** Draw every mark into a context of any size. Line weights scale with it. */
function paint(c, W, H, clear) {
  if (clear) c.clearRect(0, 0, W, H);
  const unit = Math.max(2, Math.round(Math.min(W, H) / 320));
  for (const m of marks.concat(drawing ? [drawing] : [])) {
    c.save();
    c.strokeStyle = m.colour; c.fillStyle = m.colour;
    c.lineWidth = unit; c.lineCap = 'round'; c.lineJoin = 'round';
    c.shadowColor = 'rgba(0,0,0,.75)'; c.shadowBlur = unit * 1.6;
    const P = m.pts.map(([x, y]) => [x * W, y * H]);
    if (m.tool === 'pen') {
      c.beginPath(); P.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
    } else if (m.tool === 'box' && P[1]) {
      c.strokeRect(P[0][0], P[0][1], P[1][0] - P[0][0], P[1][1] - P[0][1]);
    } else if (m.tool === 'ring' && P[1]) {
      const rx = Math.abs(P[1][0] - P[0][0]) / 2, ry = Math.abs(P[1][1] - P[0][1]) / 2;
      c.beginPath(); c.ellipse((P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2, rx, ry, 0, 0, 7); c.stroke();
    } else if (m.tool === 'arrow' && P[1]) {
      const [x0, y0] = P[0], [x1, y1] = P[1];
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      const a = Math.atan2(y1 - y0, x1 - x0), h = unit * 5.5;
      c.beginPath(); c.moveTo(x1, y1);
      c.lineTo(x1 - h * Math.cos(a - 0.4), y1 - h * Math.sin(a - 0.4));
      c.lineTo(x1 - h * Math.cos(a + 0.4), y1 - h * Math.sin(a + 0.4));
      c.closePath(); c.fill();
    } else if (m.tool === 'text') {
      c.font = '600 ' + (unit * 7) + 'px Georgia, serif';
      c.textBaseline = 'bottom';
      c.fillText(m.text, P[0][0], P[0][1]);
    }
    c.restore();
  }
}

// ---------------------------------------------------------------- saving
// The picture is flattened at its OWN size, not the size it happened to be
// shown at, so a note read six months from now is as sharp as what was filed.
async function save() {
  if (!cur) return;
  const note = $('#note').value;
  if (!note.trim() && !marks.length) return say('nothing to save on this one');
  let png = null;
  if (img.naturalWidth && marks.length) {
    const cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const c = cv.getContext('2d');
    c.drawImage(img, 0, 0);
    paint(c, cv.width, cv.height, false);
    png = cv.toDataURL('image/png');
  }
  const st = cur.state || {}, sh = st.ship || {}, ui = st.ui || {};
  const res = await (await fetch('/api/note', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: cur.id, note, png, marks, meta: {
      created_at: cur.created_at, pilot: cur.pilot, body: cur.body,
      place: sh.place || st.location, ship: sh.id, camera: ui.camera,
      at: sh.x !== undefined ? `x ${sh.x} y ${sh.y} z ${sh.z} yaw ${sh.yaw}` : null } }) })).json();
  if (!res.ok) return say('could not write it: ' + (res.error || '?'));
  cur.note = note;
  const row = [...list.children].find(c => shown[+c.dataset.i] === cur);
  if (row && !row.querySelector('.tag.note')) {
    row.querySelector('div').insertAdjacentHTML('beforeend', '<span class="tag note">written up</span>');
  }
  say('saved to bug-notes/' + res.file);
}

$('#save').onclick = save;
// Handled and back again. Closing one under the Open filter drops it out of the
// list, so the next report takes its place and the triage goes on without a
// click — which is the whole shape of the job: look, mark, next.
$('#close').onclick = async () => {
  if (!cur) return;
  const was = cur, i = shown.indexOf(was), to = was.handled ? 'reopen' : 'close';
  await fetch('/api/' + to, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: [was.id] }) });
  was.handled = !was.handled;
  say('#' + was.id + (was.handled ? ' marked handled' : ' opened again'));
  chips();
  if (!passes(was)) cur = shown[Math.min(i + 1, shown.length - 1)] || null;
  draw_list();
  markHandledLabel();
};

}

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
    return;
  }

  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); marks.pop(); redraw(); }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
  const keys = { a: 'arrow', b: 'box', r: 'ring', p: 'pen', t: 'text' };

async function loadUsage() {

const hhmm = (s) => (s >= 3600 ? Math.floor(s / 3600) + 'h ' + String(Math.round((s % 3600) / 60)).padStart(2, '0') + 'm'
  : s >= 60 ? Math.round(s / 60) + 'm' : Math.round(s) + 's');

function table(rows, cols) {
  const head = cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.h)}</th>`).join('');
  const body = rows.map(r => '<tr' + (r._us ? ' class="us"' : '') + '>'
    + cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function drawUsage() {

  H.push(`<h2>The log</h2>`);

      + ' name' + (usage.nameClashes.length === 1 ? '' : 's') + ' cover more than one browser' : ''}.
    <b>Time is wall-clock</b> from take-off to whatever ended the flight, so a tab left open
    counts; the trimmed figure caps any single flight at ${hhmm(usage.idleCut)}.
    <b>A nameless pilot is a browser that cannot remember anything</b> \u2014 the register runs

    Those ${u.namelessSessions} are counted as sessions rather than people

  H.push(`<div class="big">

  const worst = [...u.byRef].sort((a, b) => (b.abandoned + b.failed + b.wrecked) - (a.abandoned + a.failed + a.wrecked));

          + `<span class="bar bad" style="width:${Math.round(60 * pct(bad, r.flights) / 100)}px"></span>`;
      } },
  ]));

  H.push(`<h2>Where, and in what</h2>`);

  const pl = usage.all.pilotList.map(p => ({ ...p, _us: ours.has(p.id) }));
  H.push(table(pl, [
    { h: '', f: r => `<button class="mark ${r._us ? 'on' : ''}" data-id="${r.id}">${r._us ? 'us' : 'mark'}</button>` },
    { h: 'pilot', f: r => (r.name === 'a pilot unknown'
        ? '<span style="opacity:.6">' + esc(r.name) + ' <i>\u2014 storage blocked, one session</i></span>'
        : esc(r.name))
      + (r.otherNames.length ? ' <span style="opacity:.6">(also ' + esc(r.otherNames.join(', ')) + ')</span>' : '') },

// ================================================================ the models
//
// A PARTS INDICATOR, not a model editor: it says what each thing costs and what
// could be done about it, and changes nothing. The suggestions are the rules
// that were learned by hand on this project, written down so they stop being
// remembered:
//
//   INSTANCE  identical geometry AND the same material, four times or more.
//             An InstancedMesh is one draw whatever the count -- and unlike a
//             merge it SURVIVES BEING ANIMATED, which is why the Grande Roue is
//             instanced and not merged: she turns.
//   MERGE     several parts sharing a material that never move. Same one draw,
//             but the transform is baked in, so anything that animates must be
//             left out of it.
//   LOOK      a great many draws in one model. Neither of the above helps when
//             the parts are all different; that wants a cheaper far version.
//
// AND THE TRAPS, both of which cost a day here: never merge an InstancedMesh
// (its copies live in a matrix array the walker never reads, so you get one of
// them), and a merge that drops UVs makes every textured face sample one texel
// -- which looked like "the dials on the airship broke".
//
// It builds the REAL world with the real three.js, because the headless three in
// tools/ gives every mesh its own material object and so cannot answer the one
// question being asked: which parts share a material.

let THREE = null, builtWorld = null, models = [], pickedModel = null;
let pv = null;                      // the preview renderer, made once

async function three() {
  if (!THREE) THREE = await import('three');
  return THREE;
}

/** Build a world once and keep it. Paris is not cheap. */
async function getWorld() {
  if (builtWorld) return builtWorld;
  const T = await three();
  const place = $('#whichWorld').value;
  const mod = place === 'monaco' ? await import('/src/world_monaco.js')
    : place === 'stlouis' ? await import('/src/world_stlouis.js')
    : await import('/src/world.js');
  const scene = new T.Scene();
  const build = mod.buildWorldMonaco || mod.buildWorldStLouis || mod.buildWorld;
  const world = build.length > 1 ? build(scene, 'paris') : build(scene);
  builtWorld = { scene, world, place };
  return builtWorld;
}

/** What a part IS, for the purpose of asking whether two of them are the same. */
function signature(m) {
  const g = m.geometry || {};
  const p = g.parameters || {};
  const shape = (g.type || '?') + '(' + Object.keys(p).sort()
    .map((k) => (typeof p[k] === 'number' ? +p[k].toFixed(3) : p[k])).join(',') + ')';
  const mat = Array.isArray(m.material) ? m.material.map((x) => x.uuid).join('+')
    : (m.material && m.material.uuid) || '-';
  return { shape, mat, key: shape + '|' + mat };
}

const tris = (m) => {
  const g = m.geometry, a = g && g.attributes && g.attributes.position;
  if (!a) return 0;
  const n = (g.index ? g.index.count : a.count) / 3;
  return Math.round(n * (m.isInstancedMesh ? (m.count || 1) : 1));
};

function analyse(root, name) {
  const parts = [];
  root.traverse((o) => {
    if (!o.isMesh && !o.isInstancedMesh) return;
    let animates = false;
    for (let n = o, i = 0; n && i < 24; n = n.parent, i++) {
      if (n.userData && n.userData.animates) { animates = true; break; }
    }
    parts.push({ o, name: o.name || o.type, sig: signature(o), tris: tris(o),
      instanced: !!o.isInstancedMesh, count: o.count || 1, animates, visible: o.visible });
  });
  const draws = parts.filter((p) => p.visible).length;
  // group by "the same thing twice"
  const groups = new Map();
  for (const p of parts) {
    const g = groups.get(p.sig.key) || { sig: p.sig, list: [] };
    g.list.push(p);
    groups.set(p.sig.key, g);
  }
  // and by material alone, for merging
  const byMat = new Map();
  for (const p of parts) {
    if (p.instanced) continue;
    const g = byMat.get(p.sig.mat) || [];
    g.push(p);
    byMat.set(p.sig.mat, g);
  }
  const tips = [];
  for (const g of groups.values()) {
    const plain = g.list.filter((p) => !p.instanced);
    if (plain.length >= 4) {
      tips.push({ kind: 'instance', n: plain.length, saves: plain.length - 1,
        what: g.sig.shape, animates: plain.some((p) => p.animates) });
    }
  }
  for (const [mat, list] of byMat) {
    const still = list.filter((p) => !p.animates);
    const already = tips.some((t) => t.kind === 'instance' && list.some((p) => p.sig.mat === mat));
    if (still.length >= 4 && !already) {
      tips.push({ kind: 'merge', n: still.length, saves: still.length - 1,
        what: 'parts sharing one material', frozen: list.length - still.length });
    }
  }
  tips.sort((a, b) => b.saves - a.saves);
  const instanced = parts.filter((p) => p.instanced).length;
  // WHAT MAKES TWO MODELS THE SAME MODEL. The multiset of its parts' shapes --
  // not their materials, because two chestnut trees may be tinted differently
  // and are still the same tree, and not their positions, because that is the
  // whole point. This is what turns a list of 1,529 anonymous groups into
  // "here is one tree, and there are four hundred of it".
  const fingerprint = parts.map((p) => p.sig.shape).sort().join(';');
  return { name, root, parts, groups: [...groups.values()], draws, instanced,
    tris: parts.reduce((a, p) => a + p.tris, 0), tips, fingerprint };
}

/**
 * A name a person can use.
 *
 * Almost nothing in the world is named -- the game had no reason to name it --
 * so a list of "Group #146861" is no use at all. A model is described by what it
 * is MADE of and where it stands: the parts it has most of, and the landmark it
 * is nearest, which between them are enough to recognise a thing by.
 */
function label(m, landmarks) {
  const named = m.root.name || (m.parts.find((p) => p.o.name) || {}).o?.name;
  const shapes = {};
  for (const p of m.parts) {
    const k = (p.sig.shape.split('(')[0] || '?').replace(/Geometry$/, '');
    shapes[k] = (shapes[k] || 0) + 1;
  }
  const made = Object.entries(shapes).sort((a, b) => b[1] - a[1]).slice(0, 2)
    .map(([k, n]) => n + ' ' + k.toLowerCase()).join(' + ');
  let near = '';
  if (landmarks && landmarks.length) {
    const pos = m.root.position;
    let best = null;
    for (const L of landmarks) {
      const d = Math.hypot(L.x - pos.x, L.z - pos.z);
      if (!best || d < best.d) best = { d, name: L.name };
    }
    if (best && best.d < 900) near = ' · by ' + best.name;
    else if (best) near = ' · ' + Math.round(best.d / 100) / 10 + ' km from ' + best.name;
  }
  return (named ? named + ' — ' : '') + (made || m.root.type) + near;
}

async function loadModels() {
  const list = $('#modelList');
  if (models.length && builtWorld) return drawModelList();
  list.innerHTML = '<div class="empty">building the world…</div>';
  $('#parts').innerHTML = '';
  let built;
  try { built = await getWorld(); }
  catch (e) { list.innerHTML = '<div class="empty">could not build it: ' + esc(e.message) + '</div>'; return; }
  const lm = (built.world && built.world.landmarks) || [];
  const each = built.scene.children
    .filter((o) => o.type !== 'DirectionalLight' && o.type !== 'AmbientLight'
      && o.type !== 'HemisphereLight')
    .map((o, i) => analyse(o, o.name || `${o.type} #${i}`))
    .filter((m) => m.parts.length);
  // FOLD THE COPIES TOGETHER. Four hundred chestnut trees are one model and a
  // number, not four hundred entries, and the number IS the finding.
  const byShape = new Map();
  for (const m of each) {
    const g = byShape.get(m.fingerprint);
    if (g) { g.copies++; g.all.push(m); } else byShape.set(m.fingerprint, { ...m, copies: 1, all: [m] });
    // ...and remember how many DIFFERENT materials the copies use, because that
    // is what decides whether the saving on offer is real. See the tip below.
    const g2 = byShape.get(m.fingerprint);
    g2.mats = g2.mats || new Set();
    for (const part of m.parts) g2.mats.add(part.sig.mat);
  }
  models = [...byShape.values()];
  for (const m of models) m.name = label(m, lm);
  models.sort((a, b) => (b.draws * b.copies) - (a.draws * a.copies));
  drawModelList();
}

function drawModelList() {
  const list = $('#modelList');
  // draws in the WORLD, so copies count — the header used to add one of each
  const total = models.reduce((a, m) => a + m.draws * m.copies, 0);
  const copies = models.reduce((a, m) => a + m.copies, 0);
  list.innerHTML = `<div class="m" style="cursor:default;border-bottom:1px solid var(--edge)">
      <span class="d">${total}</span><span class="n">draws · ${models.length} distinct models
      in ${copies} objects</span></div>`;
  models.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'm' + (m === pickedModel ? ' on' : '');
    const fleet = m.draws * m.copies;
    el.innerHTML = `<span class="d">${fleet}</span><span class="n">`
      + (m.copies > 1 ? `<b style="color:var(--hot)">×${m.copies}</b> ` : '')
      + `${esc(m.name)}</span>`;
    el.onclick = () => pickModel(i);
    list.appendChild(el);
  });
  if (!pickedModel && models.length) pickModel(0);
}

async function pickModel(i) {
  pickedModel = models[i];
  drawModelList();
  const m = pickedModel;
  const H = [];
  if (m.copies > 1) {
    // HOW MUCH OF THIS IS REALLY ON OFFER. The copies are folded together by
    // GEOMETRY, on purpose — two chestnuts tinted differently are the same tree,
    // and an InstancedMesh carries a per-instance matrix, so differing SIZE and
    // position cost nothing (that is how the Deutsch skeleton went from thirty
    // boxes to one). Differing MATERIALS are another matter: they must be made
    // one, or carried as per-instance colour, before any of this is collectable.
    // Saying so is the difference between a tool and a wish.
    const mats = (m.mats && m.mats.size) || 1;
    const most = m.copies * m.draws - m.draws;
    H.push(`<div class="tip"><b>${m.copies} of this model, ${m.draws} draw${m.draws === 1 ? '' : 's'}
      each — ${m.draws * m.copies} in all.</b> They are the same geometry, and an instance carries
      its own matrix, so differing size and position cost nothing.
      ${mats === 1
        ? `They also share a single material, so <b>${most}</b> draws are there to be had.`
        : `But they use <b>${mats} different materials</b>, and an InstancedMesh has one. Make them
           one material — or carry the difference as per-instance colour — and <b>${most}</b> draws
           are there to be had. Until then this number is a wish, not a saving.`}</div>`);
  }
  H.push(`<div class="big">
    <div><b>${m.draws}</b><span>draw calls each</span></div>
    <div><b>${m.copies}</b><span>of it</span></div>
    <div><b>${m.tris.toLocaleString()}</b><span>triangles</span></div>
    <div><b>${m.instanced}</b><span>already instanced</span></div>
    <div><b>${m.groups.length}</b><span>distinct parts</span></div>
  </div>`);
  for (const t of m.tips) {
    if (t.kind === 'instance') {
      H.push(`<div class="tip"><b>Instance these.</b> ${t.n} parts are the same geometry and the
        same material — <code>${esc(t.what)}</code>. One InstancedMesh is <b>one draw</b> instead of
        ${t.n}, saving <b>${t.saves}</b>${t.animates ? ' — and some of them animate, which is fine: '
        + 'an instance can still be moved, where a merge could not' : ''}.</div>`);
    } else {
      H.push(`<div class="tip"><b>Merge these.</b> ${t.n} parts share one material and never move.
        Merged they are one draw, saving <b>${t.saves}</b>.
        ${t.frozen ? `Leave out the ${t.frozen} that animate — a merge bakes the transform in and
        would freeze them.` : ''} Keep the UVs, or every textured face samples one texel.</div>`);
    }
  }
  if (!m.tips.length) {
    H.push(`<div class="tip good"><b>Nothing obvious.</b> No four parts here share a geometry and a
      material. ${m.draws > 20 ? 'It is still ' + m.draws + ' draws, so if it is far away and never '
      + 'culled it wants a cheaper version rather than a cleverer one.' : 'And it is cheap already.'}</div>`);
  }
  H.push('<h2 style="font-size:14px;color:var(--hot);margin:16px 0 4px">The parts</h2>');
  const rows = m.groups.map((g) => ({
    n: g.list.length, shape: g.sig.shape,
    tris: g.list.reduce((a, p) => a + p.tris, 0),
    inst: g.list.filter((p) => p.instanced).length,
    anim: g.list.filter((p) => p.animates).length,
    name: g.list[0].name,
  })).sort((a, b) => b.n - a.n);
  H.push(table(rows, [
    { h: 'x', n: 1, f: (r) => r.n },
    { h: 'part', f: (r) => esc(r.name) },
    { h: 'geometry', f: (r) => '<span style="opacity:.7">' + esc(r.shape.slice(0, 64)) + '</span>' },
    { h: 'tris', n: 1, f: (r) => r.tris.toLocaleString() },
    { h: 'instanced', n: 1, f: (r) => r.inst || '' },
    { h: 'animates', n: 1, f: (r) => r.anim || '' },
  ]));
  $('#parts').innerHTML = H.join('');
  showPreview(m);
}

/** The model on its own, turning, so you can see what you are being told about. */
async function showPreview(m) {
  const T = await three();
  const box = $('#preview');
  if (!pv) {
    const renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    box.innerHTML = '<div class="lbl"></div>';
    box.appendChild(renderer.domElement);
    const scene = new T.Scene();
    scene.background = new T.Color(0x0d0a07);
    scene.add(new T.HemisphereLight(0xffe9c4, 0x30302a, 2.1));
    const key = new T.DirectionalLight(0xfff0d0, 1.4); key.position.set(3, 6, 2); scene.add(key);
    const camera = new T.PerspectiveCamera(45, 1, 0.1, 40000);
    const holder = new T.Group(); scene.add(holder);
    pv = { renderer, scene, camera, holder, t: 0 };
    const tick = () => {
      const w = box.clientWidth, h = box.clientHeight;
      if (w && h) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      pv.t += 0.004;
      if (pv.r) {
        camera.position.set(Math.cos(pv.t) * pv.r * 2.1, pv.r * 1.15, Math.sin(pv.t) * pv.r * 2.1);
        camera.lookAt(0, 0, 0);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    };
    tick();
  }
  // BORROWED, NOT COPIED: the object is put back where it came from as soon as
  // another is picked, so the world stays exactly as the game built it and the
  // numbers above keep meaning what they say.
  if (pv.borrowed) { pv.borrowedFrom.add(pv.borrowed); pv.borrowed.position.copy(pv.borrowedAt); }
  pv.holder.clear();
  const T2 = await three();
  const bb = new T2.Box3().setFromObject(m.root);
  const c = bb.getCenter(new T2.Vector3()), sz = bb.getSize(new T2.Vector3());
  pv.borrowed = m.root; pv.borrowedFrom = m.root.parent; pv.borrowedAt = m.root.position.clone();
  pv.holder.add(m.root);
  m.root.position.sub(c);
  pv.r = Math.max(1, sz.length() / 2);
  box.querySelector('.lbl').textContent =
    `${m.name} — ${sz.x.toFixed(1)} x ${sz.y.toFixed(1)} x ${sz.z.toFixed(1)} m`;
}

// ================================================================ the level
//
// A course seen from above, with the gates draggable.
//
// It exists because of #150: the Harbour Circuit had a corner of 167 degrees --
// very nearly a reversal -- and nobody could see it, because a course is written
// as five lines of coordinates and read as five lines of coordinates. From above
// it is obvious in a second. So the plan draws THE SAME RULE the checker applies:
// the No. 6's turning circle is 102 m at racing speed, a corner needs
// R*tan(angle/2) of straight to set up, and any corner that has not got it is
// drawn in red while you are still dragging.
//
// It writes a JSON working drawing to bug-notes/ and never touches tracks.js:
// the courses are hand-written with their reasoning in the comments beside them,
// and a tool that rewrote that file would throw the reasoning away.

const TURN_R = 102;                 // the No. 6 at racing speed; see check_scenarios
let plan = null, courses = [], course = null, dragging = null;

async function loadLevel() {
  const bar = $('#planBar');
  if (!courses.length) {
    try {
      const t = await import('/src/tracks.js');
      courses = t.TRACKS.filter((x) => x.gates && x.gates.length >= 2);
    } catch (e) {
      $('#plan').innerHTML = '<div class="empty">could not read the courses: ' + esc(e.message) + '</div>';
      return;
    }
  }
  const here = $('#whichWorld').value;
  const mine = courses.filter((c) => (c.place || 'paris') === here);
  bar.innerHTML = '';
  const sel = document.createElement('select');
  for (const c of (mine.length ? mine : courses)) {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    sel.appendChild(o);
  }
  sel.onchange = () => pickCourse(sel.value);
  bar.appendChild(sel);
  const save = document.createElement('button');
  save.className = 'go'; save.textContent = 'Save the drawing';
  save.onclick = saveCourse;
  const reset = document.createElement('button');
  reset.textContent = 'Put it back';
  reset.onclick = () => pickCourse(course && course.id, true);
  bar.appendChild(reset); bar.appendChild(save);
  const help = document.createElement('span');
  help.className = 'sub';
  help.style.color = 'var(--dim)';
  help.innerHTML = '&nbsp; drag a gate to move it · drag its <b>stalk</b> to turn it · '
    + 'red means the corner is tighter than the ship can fly';
  bar.appendChild(help);
  pickCourse((mine[0] || courses[0]).id);
}

function pickCourse(id, fresh) {
  const src = courses.find((c) => c.id === id) || courses[0];
  course = { id: src.id, name: src.name,
    gates: src.gates.map((g) => ({ x: g.x, y: g.y, z: g.z, r: g.r || 18, h: g.h || null })) };
  if (fresh) drawPlan();
  ensurePlan();
  drawPlan();
}

function ensurePlan() {
  if (plan) return;
  const host = $('#plan');
  const cv = document.createElement('canvas');
  host.innerHTML = '';
  host.appendChild(cv);
  plan = { cv, ctx: cv.getContext('2d'), view: null };
  const at = (e) => {
    const b = cv.getBoundingClientRect();
    return toWorld(e.clientX - b.left, e.clientY - b.top);
  };
  cv.addEventListener('pointerdown', (e) => {
    const w = at(e);
    let best = null;
    course.gates.forEach((g, i) => {
      const d = Math.hypot(g.x - w.x, g.z - w.z);
      const hd = Math.hypot(g.x + Math.cos(hOf(i)) * 90 - w.x, g.z - Math.sin(hOf(i)) * 90 - w.z);
      if (hd < 40 && (!best || hd < best.d)) best = { i, d: hd, mode: 'turn' };
      if (d < 60 && (!best || d < best.d)) best = { i, d, mode: 'move' };
    });
    if (best) { dragging = best; cv.setPointerCapture(e.pointerId); drawPlan(); }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const w = at(e), g = course.gates[dragging.i];
    if (dragging.mode === 'move') { g.x = w.x; g.z = w.z; }
    else g.h = Math.atan2(-(w.z - g.z), w.x - g.x);
    drawPlan();
  });
  cv.addEventListener('pointerup', () => { dragging = null; drawPlan(); });
  addEventListener('resize', () => { if (tab === 'level') drawPlan(); });
}

/** The heading a gate faces: its own if it has been turned, else down the course. */
function hOf(i) {
  const g = course.gates[i];
  if (g.h !== null && g.h !== undefined) return g.h;
  const n = course.gates[(i + 1) % course.gates.length];
  return Math.atan2(-(n.z - g.z), n.x - g.x);
}

let planView = null;
function toWorld(px, py) {
  const v = planView;
  return { x: v.x0 + px / v.k, z: v.z0 + py / v.k };
}
function toScreen(x, z) {
  const v = planView;
  return { px: (x - v.x0) * v.k, py: (z - v.z0) * v.k };
}

function drawPlan() {
  const { cv, ctx } = plan;
  const host = $('#plan');
  const W = host.clientWidth, H = host.clientHeight;
  if (!W || !H) return;
  const dpr = devicePixelRatio || 1;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const xs = course.gates.map((g) => g.x), zs = course.gates.map((g) => g.z);
  const pad = 400;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
  const z0 = Math.min(...zs) - pad, z1 = Math.max(...zs) + pad;
  const k = Math.min(W / (x1 - x0), H / (z1 - z0));
  planView = { x0, z0, k };

  ctx.fillStyle = '#0d0a07'; ctx.fillRect(0, 0, W, H);
  // a scale bar, because every judgement here is in metres
  const barM = 500, b0 = toScreen(x0 + 60, z1 - 120), b1 = toScreen(x0 + 60 + barM, z1 - 120);
  ctx.strokeStyle = '#4a3c2c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(b0.px, b0.py); ctx.lineTo(b1.px, b1.py); ctx.stroke();
  ctx.fillStyle = '#b9a682'; ctx.font = '12px Georgia, serif';
  ctx.fillText(barM + ' m', b0.px, b0.py - 6);

  const G = course.gates, n = G.length;
  // the legs, coloured by whether the corner AT THE FAR END can be flown
  for (let i = 0; i < n; i++) {
    const a = G[i], b = G[(i + 1) % n], c = G[(i + 2) % n];
    const A = toScreen(a.x, a.z), B = toScreen(b.x, b.z);
    const inL = Math.hypot(b.x - a.x, b.z - a.z);
    const ang = corner(a, b, c);
    const need = TURN_R * Math.tan((Math.min(ang, 170) / 2 * Math.PI) / 180);
    const ok = inL - need >= 0;
    ctx.strokeStyle = ok ? '#4a6b3a' : '#c0392b';
    ctx.lineWidth = ok ? 2 : 3.5;
    ctx.beginPath(); ctx.moveTo(A.px, A.py); ctx.lineTo(B.px, B.py); ctx.stroke();
  }
  // the gates themselves, with a stalk showing which way each faces
  G.forEach((g, i) => {
    const P = toScreen(g.x, g.z);
    const rr = Math.max(4, g.r * planView.k);
    ctx.strokeStyle = dragging && dragging.i === i ? '#ffd60a' : '#e8c66a';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.px, P.py, rr, 0, 7); ctx.stroke();
    const h = hOf(i);
    const S = toScreen(g.x + Math.cos(h) * 90, g.z - Math.sin(h) * 90);
    ctx.beginPath(); ctx.moveTo(P.px, P.py); ctx.lineTo(S.px, S.py); ctx.stroke();
    ctx.beginPath(); ctx.arc(S.px, S.py, 4, 0, 7); ctx.fillStyle = '#e8c66a'; ctx.fill();
    ctx.fillStyle = '#f0e2c4'; ctx.font = '13px Georgia, serif';
    ctx.fillText(String(i), P.px + rr + 4, P.py - 4);
  });
  writePlanInfo();
}

const corner = (a, b, c) => {
  const iv = { x: b.x - a.x, z: b.z - a.z }, ov = { x: c.x - b.x, z: c.z - b.z };
  return Math.abs((((Math.atan2(ov.z, ov.x) - Math.atan2(iv.z, iv.x)) * 180) / Math.PI + 540) % 360 - 180);
};

function writePlanInfo() {
  const G = course.gates, n = G.length, L = [];
  L.push(`${course.name} — ${n} gates · the No. 6 circles at ${TURN_R} m, so a corner needs `
    + `${TURN_R}·tan(angle/2) of straight before it`);
  let total = 0, worst = null;
  for (let i = 0; i < n; i++) {
    const a = G[(i - 1 + n) % n], b = G[i], c = G[(i + 1) % n];
    const inL = Math.hypot(b.x - a.x, b.z - a.z);
    total += inL;
    const ang = corner(a, b, c);
    const need = TURN_R * Math.tan((Math.min(ang, 170) / 2 * Math.PI) / 180);
    const spare = inL - need;
    if (!worst || spare < worst.spare) worst = { i, spare, ang };
    L.push(`  gate ${i}   leg in ${Math.round(inL).toString().padStart(5)} m   turn `
      + `${Math.round(ang).toString().padStart(3)}°   needs ${Math.round(need).toString().padStart(4)} m`
      + `   ${spare >= 0 ? 'spare ' : 'SHORT '}${Math.abs(Math.round(spare))} m`);
  }
  L.push(`  lap ${Math.round(total)} m · tightest gate ${worst.i} at ${Math.round(worst.ang)}°, `
    + `${Math.round(worst.spare)} m ${worst.spare >= 0 ? 'in hand' : 'SHORT'}`);
  $('#planInfo').textContent = L.join('\n');
}

async function saveCourse() {
  const res = await (await fetch('/api/course', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: course.id, gates: course.gates }) })).json();
  say(res.ok ? 'written to bug-notes/' + res.file : 'could not write it');
}

boot();
</script>
