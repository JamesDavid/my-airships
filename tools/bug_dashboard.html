<!doctype html>
<meta charset="utf-8">
<title>My Airships — what is wrong in the picture</title>
<!--
  The page half of tools/bug_dashboard.py. It never speaks to Supabase: the
  service key stays in the server, and everything here is 127.0.0.1.

  Marks are kept in NORMALISED coordinates, 0..1 across the picture, and never
  in screen pixels. The picture is shown fitted to whatever pane it has, so a
  mark stored in pixels would land somewhere else on a different window — and
  the flattened PNG is drawn at the picture's OWN size, which is larger again.
  One arrow, three sizes, one set of numbers.
-->
<style>
  :root {
    --ink: #f0e2c4; --dim: #b9a682; --panel: #2a2118; --edge: #4a3c2c;
    --paper: #17120d; --hot: #d9a441;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--paper);
    color: var(--ink); font: 14px/1.45 "Iowan Old Style", Palatino, Georgia, serif; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .02em; }
  aside { width: 310px; flex: none; border-right: 1px solid var(--edge);
    display: flex; flex-direction: column; background: #1d1710; }
  aside header { padding: 10px 12px; border-bottom: 1px solid var(--edge); }
  aside .sub { color: var(--dim); font-size: 12px; }
  #list { overflow-y: auto; flex: 1; }
  .row { padding: 8px 12px; border-bottom: 1px solid #2b2318; cursor: pointer; }
  .row:hover { background: #241d14; }
  .row.on { background: #3a2d1c; box-shadow: inset 3px 0 0 var(--hot); }
  .row .id { color: var(--hot); font-weight: 700; }
  .row .meta { color: var(--dim); font-size: 11.5px; }
  .row .snip { color: #d6c7a6; font-size: 12px; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #filters { padding: 7px 10px 8px; border-bottom: 1px solid var(--edge); background: #221b13; }
  #filters .row2 { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  #filters .row2:first-child { margin-top: 0; }
  .chip { font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--edge); background: #2f2519; color: var(--dim); cursor: pointer; }
  .chip:hover { background: #3a2f22; color: var(--ink); }
  .chip.on { background: var(--hot); border-color: var(--hot); color: #241b10; font-weight: 700; }
  .chip .n { opacity: .65; margin-left: 3px; }
  #nothing { position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; color: var(--dim); padding: 30px; }
  #nothing.show { display: flex; }
  .tag { font-size: 10.5px; padding: 0 5px; border-radius: 8px; margin-left: 5px;
    background: #4a3c2c; color: var(--ink); }
  .tag.done { background: #2f4a2c; }
  .tag.note { background: #4a3c2c; color: var(--hot); }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { padding: 7px 10px; border-bottom: 1px solid var(--edge); background: var(--panel);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 13px; color: var(--ink); background: #3a2f22;
    border: 1px solid var(--edge); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
  button:hover { background: #4a3c2c; }
  button.on { background: var(--hot); color: #241b10; border-color: var(--hot); }
  button.go { background: #4a6b3a; border-color: #5d8149; }
  button.go:hover { background: #5d8149; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; }
  .spacer { flex: 1; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #0d0a07;
    display: flex; align-items: center; justify-content: center; padding: 8px; }
  #wrap { position: relative; line-height: 0; }
  #shot { display: block; }      /* sized in fit() — see there for why not CSS */
  #ink { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
  #foot { border-top: 1px solid var(--edge); background: var(--panel); padding: 8px 10px;
    display: flex; gap: 10px; align-items: flex-start; }
  #note { flex: 1; min-height: 62px; resize: vertical; font: inherit; font-size: 13px;
    color: var(--ink); background: #17120d; border: 1px solid var(--edge);
    border-radius: 4px; padding: 6px 8px; }
  #state { width: 330px; max-height: 130px; overflow: auto; color: var(--dim);
    font: 11.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #say { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: #3a2d1c; border: 1px solid var(--hot); padding: 7px 16px; border-radius: 4px;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  #say.show { opacity: 1; }
  #typing { position: absolute; display: none; font: 600 16px/1.2 Georgia, serif;
    background: #17120dcc; color: var(--ink); border: 1px dashed var(--hot);
    padding: 2px 5px; outline: none; }
  .empty { padding: 26px; color: var(--dim); text-align: center; }
  #tabs { display: flex; gap: 4px; padding: 8px 10px 0; background: #1d1710; }
  #tabs button { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  #usage { flex: 1; overflow-y: auto; padding: 14px 18px 40px; display: none; }
  #usage.show { display: block; }
  #usage h2 { font-size: 15px; margin: 22px 0 4px; color: var(--hot); letter-spacing: .02em; }
  #usage h2:first-child { margin-top: 0; }
  #usage p.note { color: var(--dim); font-size: 12.5px; margin: 2px 0 8px; max-width: 78ch; }
  table { border-collapse: collapse; font-size: 13px; }
  th, td { padding: 3px 12px 3px 0; text-align: left; white-space: nowrap; }
  th { color: var(--dim); font-weight: 400; font-size: 11.5px; border-bottom: 1px solid var(--edge); }
  td.n, th.n { text-align: right; padding-right: 16px; font-variant-numeric: tabular-nums; }
  tr.us td { color: var(--hot); }
  .big { display: flex; gap: 26px; flex-wrap: wrap; margin: 6px 0 4px; }
  .big div { min-width: 92px; }
  .big b { display: block; font-size: 23px; line-height: 1.15; }
  .big span { color: var(--dim); font-size: 11.5px; }
  .bar { display: inline-block; height: 8px; background: #4a6b3a; border-radius: 2px;
    vertical-align: middle; }
  .bar.bad { background: #8a3b30; }
  .mark { cursor: pointer; border: 1px solid var(--edge); background: #2f2519; color: var(--dim);
    border-radius: 9px; font: inherit; font-size: 11px; padding: 0 7px; }
  .mark.on { background: var(--hot); border-color: var(--hot); color: #241b10; }
  kbd { font: 11px ui-monospace, monospace; background: #3a2f22; border: 1px solid var(--edge);
    border-radius: 3px; padding: 0 4px; }
</style>

<aside>
  <header>
    <h1>What is wrong in the picture</h1>
    <div class="sub" id="count">loading…</div>
  </header>
  <div id="filters">
    <div class="row2" id="fStatus"></div>
    <div class="row2" id="fKind"></div>
  </div>
  <div id="list"></div>
</aside>

<main>
  <div id="tabs">
    <button id="tabReports" class="on">Reports</button>
    <button id="tabUsage">Usage</button>
  </div>
  <div id="usage"></div>
  <div id="bar">
    <button data-tool="arrow" class="on">Arrow</button>
    <button data-tool="box">Box</button>
    <button data-tool="ring">Ring</button>
    <button data-tool="pen">Pen</button>
    <button data-tool="text">Text</button>
    <span style="width:8px"></span>
    <button class="swatch" data-ink="#ff3b30" style="background:#ff3b30"></button>
    <button class="swatch" data-ink="#ffd60a" style="background:#ffd60a"></button>
    <button class="swatch" data-ink="#32d74b" style="background:#32d74b"></button>
    <button class="swatch" data-ink="#0a84ff" style="background:#0a84ff"></button>
    <span style="width:8px"></span>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <span class="spacer"></span>
    <span class="sub" style="color:var(--dim)"><kbd>J</kbd><kbd>K</kbd> next · <kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
    <button id="close">Mark handled</button>
    <button id="save" class="go">Save the note</button>
  </div>

  <div id="stage">
    <div id="wrap">
      <img id="shot" alt="">
      <canvas id="ink"></canvas>
      <input id="typing" spellcheck="false">
    </div>
    <div id="nothing"></div>
  </div>

  <div id="foot">
    <textarea id="note" placeholder="What is wrong here? Plain words — “the keel bar goes through my chest”, “the water is above the quay”. The arrow says where; this says what."></textarea>
    <div id="state"></div>
  </div>
</main>

<div id="say"></div>

<script>
const $ = (s) => document.querySelector(s);
const list = $('#list'), img = $('#shot'), ink = $('#ink'), ctx = ink.getContext('2d');
let reports = [], shown = [], cur = null, marks = [], tool = 'arrow', colour = '#ff3b30', drawing = null;

// What the list is showing. Everything is held in the page and filtered here —
// the server sends all of them once, and asking it again to see what has been
// dealt with would make a round trip out of a question we can already answer.
const filter = { status: 'open', kind: 'all' };
const STATUS = [['open', 'Open'], ['handled', 'Handled'], ['all', 'All']];
const KINDS = [['all', 'Everything'], ['headset', 'Headset'],
               ['phone', 'Phone'], ['desktop', 'Desktop']];

const say = (m) => { const e = $('#say'); e.textContent = m; e.classList.add('show');
  clearTimeout(say._t); say._t = setTimeout(() => e.classList.remove('show'), 1800); };

// ---------------------------------------------------------------- the list
async function boot() {
  reports = await (await fetch('/api/reports')).json();
  $('#count').textContent = reports.length + ' report' + (reports.length === 1 ? '' : 's')
    + ' · ' + reports.filter(r => !r.handled).length + ' open'
    + ' · ' + reports.filter(r => r.note).length + ' written up';
  chips();
  draw_list();
}

const passes = (r) => (filter.status === 'all' || (filter.status === 'handled') === !!r.handled)
  && (filter.kind === 'all' || r.kind === filter.kind);

/** The chips, each carrying how many it would show — an empty filter is not a
 *  mystery if it tells you it is empty before you press it. */
function chips() {
  for (const [host, defs, key] of [[$('#fStatus'), STATUS, 'status'], [$('#fKind'), KINDS, 'kind']]) {
    host.innerHTML = '';
    for (const [val, label] of defs) {
      const was = filter[key];
      filter[key] = val;
      const n = reports.filter(passes).length;
      filter[key] = was;
      const b = document.createElement('button');
      b.className = 'chip' + (filter[key] === val ? ' on' : '');
      b.innerHTML = esc(label) + '<span class="n">' + n + '</span>';
      b.onclick = () => { filter[key] = val; chips(); draw_list(); };
      host.appendChild(b);
    }
  }
}

function draw_list() {
  shown = reports.filter(passes);
  list.innerHTML = '';
  if (!shown.length) {
    // ...and clear the stage with it. Leaving the last report standing there
    // under an empty list reads as "here is the one that matched", which is the
    // opposite of what happened.
    list.innerHTML = '<div class="empty">Nothing under this filter.</div>';
    cur = null;
    img.removeAttribute('src');
    marks = []; redraw();
    $('#note').value = '';
    $('#state').textContent = '';
    blank('Nothing matches these filters. Widen them on the left.');
    markHandledLabel();
    return;
  }
  shown.forEach((r, i) => {
    const st = r.state || {}, sh = st.ship || {};
    const el = document.createElement('div');
    el.className = 'row' + (r === cur ? ' on' : ''); el.dataset.i = i;
    el.innerHTML = `<div><span class="id">#${r.id}</span>
        <span class="meta">${(r.created_at || '').slice(0, 16).replace('T', ' ')}
        · ${esc(r.pilot || 'no name')}</span>
        <span class="tag">${esc(r.kind || '?')}</span>
        ${r.handled ? '<span class="tag done">handled</span>' : ''}
        ${r.note ? '<span class="tag note">written up</span>' : ''}</div>
      <div class="meta">${esc(sh.place || st.location || '—')}${sh.id ? ' · ' + esc(sh.id) : ''}${st.scenario ? ' · ' + esc(st.scenario) : ''}</div>
      <div class="snip">${esc((r.body || '').slice(0, 130))}</div>`;
    el.onclick = () => show(i);
    list.appendChild(el);
  });
  show(Math.max(0, shown.indexOf(cur)));
}
const esc = (s) => String(s == null ? '' : s).replace(/[<&>]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

// ---------------------------------------------------------------- one report
async function show(i) {
  if (i < 0 || i >= shown.length) return;
  cur = shown[i];
  [...list.children].forEach((c, n) => c.classList.toggle('on', n === i));
  list.children[i] && list.children[i].scrollIntoView({ block: 'nearest' });
  marks = [];
  $('#note').value = cur.note || '';
  $('#state').textContent = stateLines(cur);
  markHandledLabel();
  img.removeAttribute('src'); redraw();
  // WHY THIS SAYS SOMETHING INSTEAD OF SHOWING AN EMPTY BOX. An <img> with no
  // src, or one whose fetch failed, is a blank rectangle the same colour as the
  // pane — indistinguishable from a report whose picture is a dark sky, which
  // is exactly the fault most often filed here. It has to say which.
  const mine = cur;
  let r;
  try { r = await (await fetch('/api/shot/' + cur.id)).json(); }
  catch (e) { r = { error: 'the dashboard server is not answering — has it stopped?' }; }
  if (cur !== mine) return;                             // a faster click won
  if (r.shot) { img.src = r.shot; blank(''); }
  else blank(r.error || 'No picture was filed with this report. The state is below, '
    + 'and the words the pilot left are in the list.');
}

/** Put a plain sentence where the picture would be, or take it away again. */
function blank(msg) {
  const n = $('#nothing');
  n.textContent = msg;
  n.classList.toggle('show', !!msg);
  $('#wrap').style.visibility = msg ? 'hidden' : 'visible';
}

img.onerror = () => blank('That picture could not be decoded — it may have been '
  + 'truncated on the way in.');

img.onload = () => { fit(); redraw(); };
addEventListener('resize', () => { fit(); redraw(); });

/**
 * Size the picture to the pane, and the overlay to the picture, exactly.
 *
 * Not left to `max-width: 100%`, for two reasons. A headset picture is about
 * 1,200 px wide and this window is wider than that, so CSS alone would show it
 * small in the middle of a black field — and a fault you cannot see is a fault
 * you cannot point at, which is the whole job here. And `object-fit: contain`
 * would letterbox INSIDE the element, leaving the overlay covering bars that
 * are not picture, so every mark would land offset by half a bar. Working the
 * size out here keeps the canvas and the picture the same rectangle.
 */
function fit() {
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const pane = $('#stage'), pad = 16;
  const k = Math.min((pane.clientWidth - pad) / nw, (pane.clientHeight - pad) / nh);
  const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  img.style.width = w + 'px'; img.style.height = h + 'px';
  const dpr = devicePixelRatio || 1;
  ink.style.width = w + 'px'; ink.style.height = h + 'px';
  ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
}

function stateLines(r) {
  const st = r.state || {}, sh = st.ship || {}, p = st.page || {}, ui = st.ui || {}, inst = st.instruments || {};
  const L = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== '') L.push(k.padEnd(10) + v); };
  add('place', sh.place || st.location);
  add('ship', sh.id);
  if (sh.x !== undefined) add('at', `x ${sh.x}  y ${sh.y}  z ${sh.z}   yaw ${sh.yaw}`);
  add('camera', ui.camera);
  add('scenario', st.scenario);
  add('course', st.course && st.course.name);
  add('alt', inst.alt); add('speed', inst.speed); add('wind', inst.wind);
  add('screen', p.w && (p.w + '×' + p.h + ' @' + p.dpr));
  add('build', r.client_version);
  if ((st.faults || []).length) L.push('', 'faults:', ...st.faults.slice(0, 6).map(f => '  ' + String(f).slice(0, 90)));
  L.push('', 'repro: __game.ship.pos.set(' + [sh.x, sh.y, sh.z].join(', ') + '); __game.ship.yaw = ' + sh.yaw + ';');
  return L.join('\n');
}

// ---------------------------------------------------------------- drawing
// Everything is stored 0..1 so the same marks fit the screen and the saved PNG.
const at = (e) => {
  const b = ink.getBoundingClientRect();
  return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height];
};

ink.addEventListener('pointerdown', (e) => {
  if (!img.getAttribute('src')) return;
  const p = at(e);
  if (tool === 'text') return typeAt(p, e);
  ink.setPointerCapture(e.pointerId);
  drawing = { tool, colour, pts: [p] };
  redraw();
});
ink.addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const p = at(e);
  if (drawing.tool === 'pen') drawing.pts.push(p); else drawing.pts[1] = p;
  redraw();
});
ink.addEventListener('pointerup', () => {
  if (!drawing) return;
  const d = drawing; drawing = null;
  const far = d.pts.length > 1 && Math.hypot(d.pts[d.pts.length - 1][0] - d.pts[0][0],
    d.pts[d.pts.length - 1][1] - d.pts[0][1]) > 0.008;
  if (far) marks.push(d);                       // a stray click is not a mark
  redraw();
});

function typeAt(p, e) {
  const box = $('#typing'), b = ink.getBoundingClientRect(), w = $('#wrap').getBoundingClientRect();
  box.style.display = 'block';
  box.style.left = (b.left - w.left + p[0] * b.width) + 'px';
  box.style.top = (b.top - w.top + p[1] * b.height - 12) + 'px';
  box.style.color = colour;
  box.value = ''; box.focus();
  box.onkeydown = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault();
      if (box.value.trim()) marks.push({ tool: 'text', colour, pts: [p], text: box.value.trim() });
      box.style.display = 'none'; redraw(); }
    if (ev.key === 'Escape') { box.style.display = 'none'; }
    ev.stopPropagation();
  };
}

function redraw() { paint(ctx, ink.width, ink.height, true); }

/** Draw every mark into a context of any size. Line weights scale with it. */
function paint(c, W, H, clear) {
  if (clear) c.clearRect(0, 0, W, H);
  const unit = Math.max(2, Math.round(Math.min(W, H) / 320));
  for (const m of marks.concat(drawing ? [drawing] : [])) {
    c.save();
    c.strokeStyle = m.colour; c.fillStyle = m.colour;
    c.lineWidth = unit; c.lineCap = 'round'; c.lineJoin = 'round';
    c.shadowColor = 'rgba(0,0,0,.75)'; c.shadowBlur = unit * 1.6;
    const P = m.pts.map(([x, y]) => [x * W, y * H]);
    if (m.tool === 'pen') {
      c.beginPath(); P.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
    } else if (m.tool === 'box' && P[1]) {
      c.strokeRect(P[0][0], P[0][1], P[1][0] - P[0][0], P[1][1] - P[0][1]);
    } else if (m.tool === 'ring' && P[1]) {
      const rx = Math.abs(P[1][0] - P[0][0]) / 2, ry = Math.abs(P[1][1] - P[0][1]) / 2;
      c.beginPath(); c.ellipse((P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2, rx, ry, 0, 0, 7); c.stroke();
    } else if (m.tool === 'arrow' && P[1]) {
      const [x0, y0] = P[0], [x1, y1] = P[1];
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      const a = Math.atan2(y1 - y0, x1 - x0), h = unit * 5.5;
      c.beginPath(); c.moveTo(x1, y1);
      c.lineTo(x1 - h * Math.cos(a - 0.4), y1 - h * Math.sin(a - 0.4));
      c.lineTo(x1 - h * Math.cos(a + 0.4), y1 - h * Math.sin(a + 0.4));
      c.closePath(); c.fill();
    } else if (m.tool === 'text') {
      c.font = '600 ' + (unit * 7) + 'px Georgia, serif';
      c.textBaseline = 'bottom';
      c.fillText(m.text, P[0][0], P[0][1]);
    }
    c.restore();
  }
}

// ---------------------------------------------------------------- saving
// The picture is flattened at its OWN size, not the size it happened to be
// shown at, so a note read six months from now is as sharp as what was filed.
async function save() {
  if (!cur) return;
  const note = $('#note').value;
  if (!note.trim() && !marks.length) return say('nothing to save on this one');
  let png = null;
  if (img.naturalWidth && marks.length) {
    const cv = document.createElement('canvas');
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const c = cv.getContext('2d');
    c.drawImage(img, 0, 0);
    paint(c, cv.width, cv.height, false);
    png = cv.toDataURL('image/png');
  }
  const st = cur.state || {}, sh = st.ship || {}, ui = st.ui || {};
  const res = await (await fetch('/api/note', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: cur.id, note, png, marks, meta: {
      created_at: cur.created_at, pilot: cur.pilot, body: cur.body,
      place: sh.place || st.location, ship: sh.id, camera: ui.camera,
      at: sh.x !== undefined ? `x ${sh.x} y ${sh.y} z ${sh.z} yaw ${sh.yaw}` : null } }) })).json();
  if (!res.ok) return say('could not write it: ' + (res.error || '?'));
  cur.note = note;
  const row = [...list.children].find(c => shown[+c.dataset.i] === cur);
  if (row && !row.querySelector('.tag.note')) {
    row.querySelector('div').insertAdjacentHTML('beforeend', '<span class="tag note">written up</span>');
  }
  say('saved to bug-notes/' + res.file);
}

$('#save').onclick = save;
// Handled and back again. Closing one under the Open filter drops it out of the
// list, so the next report takes its place and the triage goes on without a
// click — which is the whole shape of the job: look, mark, next.
$('#close').onclick = async () => {
  if (!cur) return;
  const was = cur, i = shown.indexOf(was), to = was.handled ? 'reopen' : 'close';
  await fetch('/api/' + to, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids: [was.id] }) });
  was.handled = !was.handled;
  say('#' + was.id + (was.handled ? ' marked handled' : ' opened again'));
  chips();
  if (!passes(was)) cur = shown[Math.min(i + 1, shown.length - 1)] || null;
  draw_list();
  markHandledLabel();
};

/** The button says what pressing it will do, which is not always the same thing. */
function markHandledLabel() {
  $('#close').textContent = cur && cur.handled ? 'Open it again' : 'Mark handled';
}
$('#undo').onclick = () => { marks.pop(); redraw(); };
$('#clear').onclick = () => { marks = []; redraw(); };
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
  tool = b.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach(o => o.classList.toggle('on', o === b));
});
document.querySelectorAll('[data-ink]').forEach(b => b.onclick = () => { colour = b.dataset.ink; });

addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
    return;
  }
  const i = shown.indexOf(cur);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); show(i + 1); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); show(i - 1); }
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); marks.pop(); redraw(); }
  if (e.key === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
  const keys = { a: 'arrow', b: 'box', r: 'ring', p: 'pen', t: 'text' };
  if (keys[e.key]) document.querySelector('[data-tool="' + keys[e.key] + '"]').click();
});

// ---------------------------------------------------------------- the usage
//
// Everything here groups by pilot_id and never by name — see the note in
// bug_dashboard.py for why that matters, and how badly.
let usage = null, exceptUs = false;

$('#tabReports').onclick = () => showTab('reports');
$('#tabUsage').onclick = () => showTab('usage');

function showTab(which) {
  const u = which === 'usage';
  $('#tabUsage').classList.toggle('on', u);
  $('#tabReports').classList.toggle('on', !u);
  $('#usage').classList.toggle('show', u);
  for (const el of ['#bar', '#stage', '#foot']) $(el).style.display = u ? 'none' : '';
  document.querySelector('aside').style.display = u ? 'none' : '';
  if (u) loadUsage();
}

async function loadUsage() {
  const box = $('#usage');
  if (!usage) {
    box.innerHTML = '<div class="empty">reading the flight log…</div>';
    try { usage = await (await fetch('/api/usage')).json(); }
    catch (e) { box.innerHTML = '<div class="empty">could not read it: ' + esc(e.message) + '</div>'; return; }
    if (usage.error) { box.innerHTML = '<div class="empty">' + esc(usage.error) + '</div>'; usage = null; return; }
  }
  drawUsage();
}

const hhmm = (s) => (s >= 3600 ? Math.floor(s / 3600) + 'h ' + String(Math.round((s % 3600) / 60)).padStart(2, '0') + 'm'
  : s >= 60 ? Math.round(s / 60) + 'm' : Math.round(s) + 's');

function table(rows, cols) {
  const head = cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.h)}</th>`).join('');
  const body = rows.map(r => '<tr' + (r._us ? ' class="us"' : '') + '>'
    + cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.f(r)}</td>`).join('') + '</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function drawUsage() {
  const u = exceptUs ? usage.others : usage.all;
  const ours = new Set(usage.ours);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const H = [];

  H.push(`<h2>The log</h2>`);
  H.push(`<p class="note">Every figure below groups by <b>pilot_id</b>, never by name:
    names come from a pool of 399, so two strangers sharing one is likely and has
    already happened${usage.nameClashes.length ? ' \u2014 ' + usage.nameClashes.length
      + ' name' + (usage.nameClashes.length === 1 ? '' : 's') + ' cover more than one browser' : ''}.
    <b>Time is wall-clock</b> from take-off to whatever ended the flight, so a tab left open
    counts; the trimmed figure caps any single flight at ${hhmm(usage.idleCut)}.
    <b>A nameless pilot is a browser that cannot remember anything</b> \u2014 the register runs
    at boot, so no name means storage is blocked, which means a fresh id every page load.
    Those ${u.namelessSessions} are counted as sessions rather than people
    (${u.namelessFlights} flights); the real number of people behind them is smaller,
    and unknowable.</p>`);
  H.push(`<div class="big">
    <div><b>${u.named}</b><span>pilots</span></div>
    <div><b>${u.namelessSessions}</b><span>sessions, no storage</span></div>
    <div><b>${u.flights}</b><span>flights</span></div>
    <div><b>${hhmm(u.secs)}</b><span>logged</span></div>
    <div><b>${hhmm(u.secsTrimmed)}</b><span>trimmed</span></div>
    <div><b>${u.completed}</b><span>completed</span></div>
    <div><b>${pct(u.completed, u.flights)}%</b><span>of flights finish</span></div>
  </div>`);
  H.push(`<p class="note"><button class="mark ${exceptUs ? 'on' : ''}" id="exUs">
    ${exceptUs ? 'showing everyone else' : 'showing everyone'}</button>
    &nbsp;${ours.size} pilot${ours.size === 1 ? '' : 's'} marked as ours \u2014 mark them in the table at the foot.</p>`);

  const worst = [...u.byRef].sort((a, b) => (b.abandoned + b.failed + b.wrecked) - (a.abandoned + a.failed + a.wrecked));
  H.push(`<h2>What people fly, and how it ends</h2>`);
  H.push(`<p class="note">Sorted by how often it goes wrong. A high abandoned count on a
    scenario is people walking away from it, which is the thing worth fixing.</p>`);
  H.push(table(worst, [
    { h: 'what', f: r => esc(r.key) },
    { h: 'flights', n: 1, f: r => r.flights },
    { h: 'pilots', n: 1, f: r => r.pilots },
    { h: 'median', n: 1, f: r => hhmm(r.medianSecs) },
    { h: 'done', n: 1, f: r => r.completed },
    { h: 'failed', n: 1, f: r => r.failed },
    { h: 'wrecked', n: 1, f: r => r.wrecked },
    { h: 'walked away', n: 1, f: r => r.abandoned },
    { h: '', f: r => {
        const bad = r.abandoned + r.failed + r.wrecked;
        return `<span class="bar" style="width:${Math.round(60 * pct(r.completed, r.flights) / 100)}px"></span>`
          + `<span class="bar bad" style="width:${Math.round(60 * pct(bad, r.flights) / 100)}px"></span>`;
      } },
  ]));

  H.push(`<h2>Where, and in what</h2>`);
  H.push('<div style="display:flex;gap:44px;flex-wrap:wrap">');
  for (const [title, rows] of [['place', u.byPlace], ['ship', u.byShip]]) {
    H.push('<div>' + table(rows, [
      { h: title, f: r => esc(r.key) },
      { h: 'flights', n: 1, f: r => r.flights },
      { h: 'pilots', n: 1, f: r => r.pilots },
      { h: 'median', n: 1, f: r => hhmm(r.medianSecs) },
    ]) + '</div>');
  }
  H.push('</div>');

  H.push(`<h2>By the day</h2>`);
  const peak = Math.max(1, ...u.byDay.map(d => d.flights));
  H.push(table(u.byDay, [
    { h: 'day', f: r => esc(r.key) },
    { h: 'flights', n: 1, f: r => r.flights },
    { h: 'pilots', n: 1, f: r => r.pilots },
    { h: '', f: r => `<span class="bar" style="width:${Math.round(180 * r.flights / peak)}px"></span>` },
  ]));

  H.push(`<h2>The pilots</h2>`);
  H.push(`<p class="note">One row per browser. Mark the ones that are you and they can be
    left out of everything above \u2014 it is kept in bug-notes/ours.json, not sent anywhere.
    <b>idle</b> counts that pilot's flights longer than ${hhmm(usage.idleCut)}, which are
    usually a tab left open rather than a flight.</p>`);
  const pl = usage.all.pilotList.map(p => ({ ...p, _us: ours.has(p.id) }));
  H.push(table(pl, [
    { h: '', f: r => `<button class="mark ${r._us ? 'on' : ''}" data-id="${r.id}">${r._us ? 'us' : 'mark'}</button>` },
    { h: 'pilot', f: r => (r.name === 'a pilot unknown'
        ? '<span style="opacity:.6">' + esc(r.name) + ' <i>\u2014 storage blocked, one session</i></span>'
        : esc(r.name))
      + (r.otherNames.length ? ' <span style="opacity:.6">(also ' + esc(r.otherNames.join(', ')) + ')</span>' : '') },
    { h: 'flights', n: 1, f: r => r.flights },
    { h: 'time', n: 1, f: r => hhmm(r.secs) },
    { h: 'done', n: 1, f: r => r.completed },
    { h: 'places', n: 1, f: r => r.places },
    { h: 'ships', n: 1, f: r => r.ships },
    { h: 'idle', n: 1, f: r => r.idle || '' },
    { h: 'first', f: r => esc(r.first) },
    { h: 'last', f: r => esc(r.last) },
    { h: 'id', f: r => '<span style="opacity:.45">' + esc(r.id.slice(0, 8)) + '</span>' },
  ]));

  $('#usage').innerHTML = H.join('');
  $('#exUs').onclick = () => { exceptUs = !exceptUs; drawUsage(); };
  for (const b of document.querySelectorAll('#usage .mark[data-id]')) {
    b.onclick = async () => {
      const id = b.dataset.id, on = b.classList.contains('on');
      const r = await (await fetch('/api/ours', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(on ? { remove: [id] } : { add: [id] }) })).json();
      usage.ours = r.ours;
      usage = null;                       // the split is worked out server-side
      await loadUsage();
    };
  }
}

boot();
</script>
